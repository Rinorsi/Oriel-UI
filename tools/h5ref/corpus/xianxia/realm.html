<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>修仙 · 境界面板</title>
<style>
  :root { --ink: #1c1a17; --paper: #efe6d2; --jade: #4fae8f; --jade-deep: #1f5e4c; --gold: #c9a24a; --cinnabar: #b8322a; }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: grid; place-items: center; color: var(--ink);
    font-family: "STKaiti", "KaiTi", "楷体", serif;
    background: radial-gradient(ellipse at 50% 120%, #9fb9b0 0%, #dfe7e2 55%, #f3f1ea 100%); }
  .mountains { position: fixed; left: 0; right: 0; bottom: 0; height: 90px;
    background: radial-gradient(ellipse 120px 60px at 15% 100%, rgba(40, 60, 55, .55), transparent 70%),
                radial-gradient(ellipse 160px 80px at 55% 100%, rgba(40, 60, 55, .4), transparent 70%),
                radial-gradient(ellipse 140px 70px at 90% 100%, rgba(40, 60, 55, .5), transparent 70%);
    filter: blur(2px); }
  .scroll { position: relative; width: 330px; padding: 16px 22px; background: var(--paper);
    background-image: radial-gradient(rgba(0, 0, 0, .04) 1px, transparent 1px); background-size: 4px 4px;
    border-top: 6px solid #5b3a1e; border-bottom: 6px solid #5b3a1e; box-shadow: 0 8px 20px rgba(0, 0, 0, .25); }
  .scroll::before, .scroll::after { content: ""; position: absolute; top: -10px; bottom: -10px; width: 10px; border-radius: 5px;
    background: linear-gradient(90deg, #3a2412, #8b5a2b, #3a2412); }
  .scroll::before { left: -8px; } .scroll::after { right: -8px; }
  .title { display: flex; align-items: baseline; gap: 8px; border-bottom: 1px solid rgba(0,0,0,.2); padding-bottom: 4px; }
  .title h1 { margin: 0; font-size: 18px; letter-spacing: 4px; }
  .seal { margin-left: auto; width: 26px; height: 26px; border: 2px solid var(--cinnabar); color: var(--cinnabar); border-radius: 3px;
    display: grid; place-items: center; font-size: 10px; transform: rotate(-8deg); opacity: .85; }
  .realm { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
  .pearl { width: 46px; height: 46px; border-radius: 50%; flex: none;
    background: radial-gradient(circle at 35% 30%, #e7fff6, var(--jade) 50%, var(--jade-deep));
    box-shadow: 0 0 14px rgba(79, 174, 143, .8), inset -4px -6px 10px rgba(0,0,0,.25); animation: qi 3s ease-in-out infinite; }
  @keyframes qi { 50% { box-shadow: 0 0 24px rgba(79, 174, 143, 1), inset -4px -6px 10px rgba(0,0,0,.25); } }
  .realm .name { font-size: 14px; }
  .realm .name em { font-style: normal; color: var(--gold); }
  .bar { height: 6px; margin-top: 4px; background: rgba(0,0,0,.1); border-radius: 3px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 64%; background: linear-gradient(90deg, var(--jade-deep), var(--jade), #b9f5df); }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 10px; }
  .stats div { text-align: center; padding: 4px 0; border: 1px solid rgba(0,0,0,.15); background: rgba(255,255,255,.35); font-size: 10px; }
  .stats b { display: block; font-size: 13px; color: var(--jade-deep); }
  .btn { margin-top: 10px; width: 100%; padding: 5px; border: 1px solid var(--gold); color: #fff8e6; font: inherit; letter-spacing: 6px;
    background: linear-gradient(#7b1f19, var(--cinnabar)); box-shadow: 0 2px 0 #4a120e, 0 0 10px rgba(201, 162, 74, .5); cursor: pointer; }
  .clouds { position: absolute; right: -30px; top: -20px; width: 80px; height: 30px; opacity: .6;
    background: radial-gradient(circle at 20% 60%, #fff 0 10px, transparent 11px), radial-gradient(circle at 45% 40%, #fff 0 14px, transparent 15px),
    radial-gradient(circle at 75% 60%, #fff 0 11px, transparent 12px); animation: drift 8s ease-in-out infinite alternate; }
  @keyframes drift { to { transform: translateX(-20px); } }
</style>
</head>
<body>
<div class="mountains"></div>
<div class="scroll">
  <div class="clouds"></div>
  <div class="title"><h1>道途</h1><span>青云宗 · 外门弟子</span><div class="seal">仙</div></div>
  <div class="realm"><div class="pearl"></div>
    <div style="flex:1"><div class="name">筑基 <em>中期</em> · 灵力 6400 / 10000</div><div class="bar"><i></i></div></div></div>
  <div class="stats"><div>悟性<b>87</b></div><div>根骨<b>72</b></div><div>气运<b>51</b></div></div>
  <button class="btn">闭 关 修 炼</button>
</div>
</body>
</html>
