<!doctype html>
<html><head><meta charset="utf-8"><title>Blocks and gradients</title><style>
* { box-sizing: border-box; }
body { margin: 0; }
.solid { position: absolute; left: 16px; top: 16px; width: 100px; height: 80px; background: #267da8; }
.round { position: absolute; left: 132px; top: 16px; width: 120px; height: 80px; background: #f1c05b; border: 4px solid #493829; border-radius: 16px; }
.gradient { position: absolute; left: 16px; top: 120px; width: 360px; height: 80px; background: linear-gradient(to right, #223355, #66bbcc); }
</style></head><body><div class="solid"></div><div class="round"></div><div class="gradient"></div></body></html>
