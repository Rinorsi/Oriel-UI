<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: "Orbitron"; src: url(orbitron.woff2); }
:root { --cyan: #3ff6ff; --bg: rgba(8, 20, 32, .55); }
* { box-sizing: border-box; }
body { margin: 0; font-family: "Orbitron", system-ui, sans-serif; color: var(--cyan); }
.hud { position: fixed; inset: 0; pointer-events: none; }
.panel { position: absolute; left: 16px; bottom: 16px; width: 220px; padding: 10px 14px;
  background: var(--bg); backdrop-filter: blur(8px) saturate(140%);
  clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 14px 100%, 0 calc(100% - 14px));
  border: 1px solid rgba(63, 246, 255, .4); box-shadow: 0 0 12px rgba(63,246,255,.35), inset 0 0 18px rgba(63,246,255,.15); }
.panel::before { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(0deg, rgba(255,255,255,.04) 0 1px, transparent 1px 3px); mix-blend-mode: screen; }
.bar { height: 6px; background: rgba(255,255,255,.08); margin: 6px 0; overflow: hidden; border-radius: 3px; }
.bar > i { display: block; height: 100%; width: 72%; background: linear-gradient(90deg, #00e0ff, #7cfffa); filter: drop-shadow(0 0 4px #3ff6ff); }
.label { letter-spacing: .2em; text-transform: uppercase; font-size: 10px; text-shadow: 0 0 6px var(--cyan); }
.ring { position: absolute; right: 24px; bottom: 24px; width: 72px; height: 72px; border-radius: 50%;
  background: conic-gradient(var(--cyan) 0 68%, rgba(255,255,255,.08) 68% 100%);
  mask: radial-gradient(circle, transparent 58%, #000 60%); }
.reticle { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 40px; height: 40px; }
.card { position: absolute; right: 16px; top: 16px; width: 180px; padding: 8px; transform: perspective(600px) rotateY(-12deg);
  background: linear-gradient(135deg, rgba(63,246,255,.18), rgba(63,246,255,.02)); border: 1px solid rgba(63,246,255,.3); }
.card h3 { margin: 0 0 4px; font-weight: 600; filter: brightness(1.3); }
@keyframes scan { from { transform: translateY(-100%); } to { transform: translateY(100%); } }
.scan { position: absolute; inset: 0; background: linear-gradient(transparent, rgba(63,246,255,.15), transparent); animation: scan 3s linear infinite; }
.hex { position: absolute; inset: 0; opacity: .08; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='28' height='49'><path d='M14 0l14 8v16l-14 8L0 24V8z' fill='none' stroke='%233ff6ff'/></svg>"); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(32px, 1fr)); gap: 4px; }
.slot:has(.hot) { outline: 1px solid var(--cyan); }
.panel .row { display: flex; & span { flex: 1; } }
</style></head>
<body>
<div class="hud">
  <div class="hex"></div>
  <div class="panel"><div class="scan"></div>
    <div class="label">Shield</div><div class="bar"><i></i></div>
    <div class="label">Energy</div><div class="bar"><i style="width:45%"></i></div>
    <div class="row"><span>AMMO</span><span>32 / 120</span></div>
  </div>
  <div class="ring"></div>
  <svg class="reticle" viewBox="0 0 40 40"><circle cx="20" cy="20" r="12" fill="none" stroke="#3ff6ff" stroke-width="1.5"/><path d="M20 0v10M20 30v10M0 20h10M30 20h10" stroke="#3ff6ff"/></svg>
  <div class="card"><h3>MISSION</h3><p>Reach the relay tower</p><div class="grid"><div class="slot"><b class="hot"></b></div><div class="slot"></div></div></div>
</div>
</body></html>
