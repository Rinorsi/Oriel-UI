<!doctype html>
<html><head><meta charset="utf-8"><title>Flex geometry</title><style>
* { box-sizing: border-box; }
body { margin: 0; padding: 16px; }
.row { display: flex; width: 395px; height: 100px; gap: 12px; padding: 8px; background: #e2e8ef; align-items: center; }
.a { width: 60px; height: 60px; background: #d67655; }
.b { flex: 1; height: 40px; background: #4f9877; }
.c { width: 80px; height: 80px; background: #586fa8; }
</style></head><body><div class="row"><div class="a"></div><div class="b"></div><div class="c"></div></div></body></html>
