<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dungeons-style mission select</title>
<style>
  :root { --stone: #5b5f66; --stone-dark: #2e3035; --stone-hi: #8c9098; --emerald: #2ecc71; --amber: #f5a623; --ink: #f6f1e7; }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: grid; place-items: center; color: var(--ink); font-family: "Segoe UI Black", "Arial Black", sans-serif;
    background: radial-gradient(ellipse at 50% 30%, #3d5a3a, #141a14 75%); }
  .panel { position: relative; width: 390px; padding: 12px; border-radius: 12px;
    background: linear-gradient(var(--stone), var(--stone-dark));
    box-shadow: inset 0 3px 0 var(--stone-hi), inset 0 -4px 0 #1b1c20, 0 10px 0 #111, 0 14px 30px rgba(0,0,0,.6); }
  .panel h1 { margin: 0 0 8px; font-size: 16px; text-align: center; letter-spacing: 1px; text-transform: uppercase;
    text-shadow: 0 2px 0 #000, 0 0 12px rgba(245, 166, 35, .5); }
  .maps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .map { position: relative; height: 92px; border-radius: 10px; overflow: hidden; cursor: pointer;
    box-shadow: inset 0 0 0 3px rgba(0,0,0,.45), 0 4px 0 #111; transition: transform .15s, box-shadow .15s; }
  .map:hover { transform: translateY(-3px); box-shadow: inset 0 0 0 3px var(--amber), 0 7px 0 #111, 0 0 16px rgba(245, 166, 35, .6); }
  .map .art { position: absolute; inset: 0; }
  .map:nth-child(1) .art { background: linear-gradient(160deg, #6fb3e0, #2f6a3a 55%, #1f3d22); }
  .map:nth-child(2) .art { background: linear-gradient(160deg, #f3c27a, #b5652b 55%, #4a2410); }
  .map:nth-child(3) .art { background: linear-gradient(160deg, #6b4a8f, #2a1d4a 55%, #0e0a1d); filter: saturate(.6) brightness(.8); }
  .map .shade { position: absolute; inset: 0; background: linear-gradient(transparent 40%, rgba(0,0,0,.75)); }
  .map .name { position: absolute; left: 6px; right: 6px; bottom: 16px; font-size: 9px; text-shadow: 0 2px 0 #000; }
  .map .diff { position: absolute; left: 6px; bottom: 5px; display: flex; gap: 2px; }
  .map .diff i { width: 7px; height: 7px; transform: rotate(45deg); background: var(--amber); box-shadow: 0 1px 0 #000; }
  .map .diff i.off { background: rgba(255,255,255,.2); }
  .map .lock { position: absolute; inset: 0; display: grid; place-items: center; font-size: 22px; background: rgba(0,0,0,.45); backdrop-filter: grayscale(1) blur(1px); }
  .map .badge { position: absolute; right: 5px; top: 5px; padding: 2px 5px; font-size: 7px; border-radius: 8px; background: var(--emerald); color: #08210f; box-shadow: 0 2px 0 #0b5d2c; }
  .footer { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
  .power { display: flex; align-items: center; gap: 4px; font-size: 11px; }
  .power .gem { width: 14px; height: 14px; transform: rotate(45deg); background: linear-gradient(135deg, #8ff7c0, var(--emerald) 50%, #0b5d2c);
    box-shadow: 0 0 8px rgba(46, 204, 113, .7); }
  .go { margin-left: auto; padding: 6px 18px; font: inherit; font-size: 11px; color: #3b2300; cursor: pointer; border: 0; border-radius: 8px;
    background: linear-gradient(#ffd27a, var(--amber)); box-shadow: inset 0 2px 0 #fff2c9, inset 0 -3px 0 #b8720b, 0 4px 0 #6b4105;
    animation: bob 1.6s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-2px); } }
  .emeralds { font-size: 10px; color: var(--emerald); text-shadow: 0 1px 0 #000; }
</style>
</head>
<body>
<div class="panel">
  <h1>Mission Select</h1>
  <div class="maps">
    <div class="map"><div class="art"></div><div class="shade"></div><span class="badge">NEW</span><div class="name">Creeper Woods</div><div class="diff"><i></i><i class="off"></i><i class="off"></i></div></div>
    <div class="map"><div class="art"></div><div class="shade"></div><div class="name">Cacti Canyon</div><div class="diff"><i></i><i></i><i class="off"></i></div></div>
    <div class="map"><div class="art"></div><div class="shade"></div><div class="name">Obsidian Pinnacle</div><div class="diff"><i></i><i></i><i></i></div><div class="lock">🔒</div></div>
  </div>
  <div class="footer"><div class="power"><span class="gem"></span>Power 42</div><span class="emeralds">◆ 1,280</span><button class="go">Launch</button></div>
</div>
</body>
</html>
