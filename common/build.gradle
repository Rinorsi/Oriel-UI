plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev'
}

neoForge {
    neoFormVersion = neo_form_version
    // The access transformer, with its Stonecutter comments resolved for this version.
    accessTransformers.from(stonecutter.process(parent.file('src/main/resources/META-INF/accesstransformer.cfg'),
            'build/stonecutter-processed/accesstransformer.cfg'))
}

dependencies {
    implementation(project(':engine'))
    implementation(project(':script-rhino'))
    implementation(project(':mc-extension'))
    implementation(project(':kit'))
    compileOnly(project(path: ':rhino', configuration: 'relocated'))
    testImplementation(platform("org.junit:junit-bom:${junit_version}"))
    testImplementation('org.junit.jupiter:junit-jupiter')
    testImplementation("com.google.code.gson:gson:${gson_version}")
    testRuntimeOnly('org.junit.platform:junit-platform-launcher')
}

// Common's host policies can be tested without booting Minecraft.
sourceSets.test.java.setSrcDirs([parent.file('src/test/java')])
tasks.named('test', Test) { useJUnitPlatform() }

tasks.register('checkPublicApi', Exec) {
    group = 'verification'
    dependsOn('compileJava')
    def cpFile = layout.buildDirectory.file('api-check/classpath.txt')
    def apiClasspath = sourceSets.main.output.classesDirs + sourceSets.main.compileClasspath
    def apiSources = sourceSets.main.java.srcDirs
    def apiTool = rootProject.file('tools/api/ApiCheck.java')
    def apiSnapshot = rootProject.file('api/' + project.name + '.txt')
    def updateApi = project.hasProperty('updateApi')
    def apiJava = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
    doFirst {
        cpFile.get().asFile.parentFile.mkdirs()
        cpFile.get().asFile.text = apiClasspath.asPath
        def source = apiSources.find { new File(it, 'dev/oriel/mod/server/OrielServer.java').exists() }
        def parameters = [apiJava.get().executablePath.asFile, apiTool, source, cpFile.get().asFile, apiSnapshot]
        if (updateApi) parameters.add('--update')
        commandLine(parameters)
    }
}
tasks.named('check') { dependsOn('checkPublicApi') }

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

// The loaders compile common's sources and copy its resources themselves. Stonecutter sets the source directories:
// the shared src/ for the active version, a generated copy for the others, and versions/<version>/src for files of one
// version only.
artifacts {
    sourceSets.main.java.srcDirs.each { dir ->
        commonJava(dir) { builtBy(sourceSets.main.java.sourceDirectories) }
    }
    sourceSets.main.resources.srcDirs.each { dir ->
        commonResources(dir) { builtBy(sourceSets.main.resources.sourceDirectories) }
    }
}

// For versions other than the active one, Minecraft's artifacts read the access transformer from the resources
// Stonecutter generates.
if (!stonecutter.current.isActive) {
    tasks.named('createMinecraftArtifacts') {
        dependsOn(tasks.named('stonecutterGenerate'))
    }
}
