plugins {
    id 'multiloader-common'
    id 'multiloader-publish'
}

configurations {
    commonJava {
        canBeResolved = true
        canBeConsumed = false
    }
    commonResources {
        canBeResolved = true
        canBeConsumed = false
    }
    // The engine's sources, for javadoc.
    engineJava {
        canBeResolved = true
        canBeConsumed = false
    }
    // The engine's compiled classes and resources.
    engineClasses {
        canBeResolved = true
        canBeConsumed = false
    }
    mcExtensionClasses {
        canBeResolved = true
        canBeConsumed = false
    }
    scriptClasses {
        canBeResolved = true
        canBeConsumed = false
    }
    rhinoRelocated {
        canBeResolved = true
        canBeConsumed = false
    }
    // The kit's (Ore theme and presets) compiled classes and resources.
    kitClasses {
        canBeResolved = true
        canBeConsumed = false
    }
}

// The common subproject for the same Minecraft version.
def common = ":common:${project.name}"

dependencies {
    compileOnly(project(common)) {
        def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
        attributes {
            attribute(loaderAttribute, 'common')
        }
    }
    commonJava(project(path: common, configuration: 'commonJava'))
    commonResources(project(path: common, configuration: 'commonResources'))
    // The engine is compiled once, by :engine. The loaders compile against it and copy its classes (processResources).
    compileOnly(project(':engine'))
    compileOnly(project(':script-rhino'))
    compileOnly(project(':mc-extension'))
    mcExtensionClasses(project(path: ':mc-extension', configuration: 'mcExtensionClasses'))
    scriptClasses(project(path: ':script-rhino', configuration: 'scriptClasses'))
    engineJava(project(path: ':engine', configuration: 'engineJava'))
    engineClasses(project(path: ':engine', configuration: 'engineClasses'))
    compileOnly(project(':kit'))
    kitClasses(project(path: ':kit', configuration: 'kitClasses'))
    rhinoRelocated(project(path: ':rhino', configuration: 'relocated'))
    compileOnly(project(path: ':rhino', configuration: 'relocated'))
}

tasks.named('compileJava', JavaCompile) {
    source(configurations.commonJava)
}

processResources {
    // The engine's classes and the relocated Rhino classes ship inside the mod itself (dev and jar), so there is no
    // nested jar to resolve. Both are compiled once, in their own projects, for every Minecraft version and loader.
    dependsOn(configurations.rhinoRelocated)
    from({ configurations.rhinoRelocated.collect { zipTree(it) } }) {
        exclude('META-INF/MANIFEST.MF')
    }
    from(configurations.commonResources)
    from(configurations.engineClasses)
    from(configurations.scriptClasses)
    from(configurations.mcExtensionClasses)
    from(configurations.kitClasses)
}

tasks.named('javadoc', Javadoc).configure {
    source(configurations.commonJava)
    source(configurations.engineJava)
    failOnError = false
}

tasks.named('sourcesJar', Jar) {
    from(configurations.commonJava)
    from(configurations.commonResources)
}

// The client run's system properties and program arguments, which each loader's build script sets with its own run DSL.
// `./gradlew :neoforge:26.3:runClient -Pautopilot` (or :fabric:26.1...) opens the Oriel demo screens, screenshots
// them and quits; `-Pautopilot=scene` runs only the scene showcase's steps. `-Ptour [-PtourGo=<file>] [-PtourShots]`: the scripted showcase tour for demo videos, in a 1280x720
// window (tools/record creates the go-file once it is recording); tourShots saves a screenshot at each beat, and
// `-Ptour=scene,shop` plays only those beats (title, mobdex, turntable, shop, scene, end).
def clientRunProperties = [:]
def clientRunArgs = []
if (project.hasProperty('probeRole')) {
    String role = project.property('probeRole').toString()
    if (!(role in ['A', 'B'])) throw new GradleException('probeRole must be A or B')
    clientRunProperties['oriel.probeRole'] = role
    if (project.hasProperty('probeProtocol')) clientRunProperties['oriel.probeProtocol'] = project.property('probeProtocol').toString()
    if (project.hasProperty('probeMissing')) clientRunProperties['oriel.probeMissing'] = 'true'
    clientRunArgs.addAll('--username', 'OrielProbe' + role, '--quickPlayMultiplayer',
            project.findProperty('probeAddress')?.toString() ?: '127.0.0.1:25565')
}
if (project.hasProperty('autopilot') || project.hasProperty('tour')) {
    clientRunProperties['oriel.autopilot'] = 'true'
    String only = project.findProperty('autopilot')?.toString()
    if (only && only != 'true') clientRunProperties['oriel.autopilot.only'] = only
    // The kit presets are judged at the GUI size most players see: 640x360 (1280x720 at GUI scale 2).
    if (only == 'oriel' || only == 'play' || only == 'smoke' || only == 'mcp') clientRunArgs.addAll('--width', '1280', '--height', '720')
    if (only == 'mcp') {
        if (!project.hasProperty('orielMcpTask')) throw new GradleException('MCP preview requires -PorielMcpTask=<task.json>')
        clientRunProperties['oriel.mcp.task'] = project.property('orielMcpTask').toString()
    }
    if (only == 'home' || only == 'reload' || only == 'text') clientRunArgs.addAll('--width', '1600', '--height', '900')
    // -Pautopilot=play: hands-on acceptance (see DevAutopilot); -Poriel_play_test screenshots it and quits.
    if (project.hasProperty('oriel_play_test')) clientRunProperties['oriel.play.test'] = 'true'
}
if (project.hasProperty('tour')) {
    clientRunProperties['oriel.tour'] = 'true'
    String beats = project.findProperty('tour')?.toString()
    if (beats && beats != 'true') clientRunProperties['oriel.tour.only'] = beats
    if (project.hasProperty('tourGo')) clientRunProperties['oriel.tour.go'] = project.property('tourGo').toString()
    if (project.hasProperty('tourShots')) clientRunProperties['oriel.tour.shots'] = 'true'
    clientRunArgs.addAll('--width', '1280', '--height', '720')
}
ext.clientRunProperties = clientRunProperties
ext.clientRunArgs = clientRunArgs

// Game run directories never live in the repository. They go under -Poriel_run_dir or the ORIEL_RUN_DIR environment
// variable when one is set, else under the root project's build directory, one directory per subproject and run:
// <root>/fabric-26.3/client and so on. The runs get the subproject's directory as oriel.sourceRoot, where dev hot
// reload starts looking for asset source trees (OrielResources), since the working directory is elsewhere.
def configuredRunRoot = findProperty('oriel_run_dir') ?: System.getenv('ORIEL_RUN_DIR')
def runRoot = configuredRunRoot ? file(configuredRunRoot) : rootProject.layout.buildDirectory.dir('runs').get().asFile
ext.orielRunDir = { String run ->
    // The smoke runner gives each target its own directory directly beneath the requested root.
    String suffix = run == 'client' && findProperty('autopilot') == 'smoke' ? '' : "/${run}"
    new File(runRoot, "${project.parent.name}-${project.name}${suffix}")
}
clientRunProperties['oriel.sourceRoot'] = project.projectDir.absolutePath
// Java hot reload (DevReload): where to run Gradle, which project's classes to build, and the self-attach it needs.
clientRunProperties['oriel.dev.root'] = rootProject.projectDir.absolutePath
clientRunProperties['oriel.dev.project'] = project.path
clientRunProperties['jdk.attach.allowAttachSelf'] = 'true'

// -Poriel_release builds the jar players get: the dev autopilot and scripted tour (classes and pages) stay out. Code
// elsewhere only reaches them through DevFlags, which checks class resources before enabling a tool.
if (project.hasProperty('oriel_release')) {
    tasks.named('jar', Jar) {
        ['DevAutopilot', 'DevTour', 'DevPointer', 'DevReload', 'DevAgent', 'DevInspector', 'TourCursor', 'TourPointer', 'CursorArt'].each { exclude("dev/oriel/mod/internal/client/${it}*.class") }
        exclude('dev/oriel/engine/inspect/**', 'dev/oriel/engine/script/InspectorBindings*.class')
        exclude('assets/oriel/oriel/dev/**')
    }
}
