// Standalone previewer: renders Oriel documents with Java2D using Minecraft's real font and GUI sprites (read from
// the user's Minecraft client jar), reloads on save, and has an inspector. Also the snapshot-test harness.
// A development tool: never shipped in the mod, so it may use the full toolchain release.
plugins {
    id 'oriel-errorprone'
    id 'application'
    id 'oriel-java'
}

dependencies {
    implementation(project(':engine'))
    // The Ore theme and presets, so their pages preview with their controllers.
    implementation(project(':kit'))
    implementation(project(':script-rhino'))
    implementation(project(':mc-extension'))
    // The engine only compiles against Gson (Minecraft provides it in game).
    implementation("com.google.code.gson:gson:${gson_version}")
}

application {
    mainClass = 'dev.oriel.preview.Preview'
}

// Separate from check: machine load and CPU affect wall-clock timings; baselines require deliberate review.
tasks.register('benchmarkFrames', JavaExec) {
    group = 'verification'
    description = 'Compare per-page ImageCanvas frame p50/p95 against the reviewed baseline.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'dev.oriel.preview.FrameBenchmark'
    workingDir = rootProject.projectDir
    systemProperty('java.awt.headless', 'true')
    minHeapSize = '1g'
    maxHeapSize = '1g'
    systemProperty('oriel.benchUpdate', project.hasProperty('updateFrameBaseline'))
    ['benchWarmup', 'benchFrames', 'benchRounds', 'benchTolerance'].each { key ->
        if (project.hasProperty(key)) systemProperty('oriel.' + key, project.property(key))
    }
    args(rootProject.file('kit/src/main/resources/assets/oriel/ui'),
            project.findProperty('frameBaseline') ?: rootProject.file('preview/benchmarks/frames.json'),
            project.findProperty('frameReport') ?: layout.buildDirectory.file('benchmarks/frames-actual.json').get().asFile)
}

tasks.named('run', JavaExec) {
    // Page paths in --args are typed relative to the repository root.
    workingDir = rootProject.projectDir
}

tasks.named('test', Test) {
    systemProperty('oriel.layout.block', providers.gradleProperty('blockLayoutBackend').getOrElse('old'))
    systemProperty('java.awt.headless', 'true')
    // The goldens, read from the project directory (Snapshots.java); the diffs go to build/snapshots.
    inputs.dir('src/test/snapshots').withPathSensitivity(PathSensitivity.RELATIVE)
    // -Doriel.updateSnapshots=true rewrites goldens; -Doriel.mcJar=... picks the Minecraft jar.
    ['oriel.updateSnapshots', 'oriel.mcJar'].each { key ->
        String value = System.getProperty(key)
        if (value != null) systemProperty(key, value)
    }
    if (System.getProperty('oriel.updateSnapshots') != null) outputs.upToDateWhen { false }
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ['-Xlint:all', '-Werror']
}

// `./gradlew :preview:checkUi [-Pui=<dir or page>] [-Plang=en_us] [-PuiStrict]`: loads every kit page (or the given ones) headless with its
// controller at 640x360 and 427x240, and fails on an engine or controller error or a missing image; CSS the engine
// did not take as written is listed. -PuiStrict makes warnings fail with exit 3 (page errors remain exit 1).
// Without it, warnings remain nonfatal. CI checks both the default language and en_us strictly.
tasks.register('checkUi', JavaExec) {
    systemProperty('oriel.layout.block', providers.gradleProperty('blockLayoutBackend').getOrElse('old'))
    group = 'verification'
    description = 'Checks every UI page for errors, missing images and CSS diagnostics'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'dev.oriel.preview.Preview'
    workingDir = rootProject.projectDir
    systemProperty('java.awt.headless', 'true')
    args('--check', project.findProperty('ui') ?: 'kit/src/main/resources/assets/oriel/ui')
    if (project.hasProperty('lang')) args('--lang', project.property('lang'))
    if (project.hasProperty('uiStrict')) args('--strict')
}
