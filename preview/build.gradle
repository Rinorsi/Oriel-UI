// Standalone previewer: renders Oriel documents with Java2D using Minecraft's real font and GUI sprites (read from
// the user's Minecraft client jar), reloads on save, and has an inspector. Also the snapshot-test harness.
// A development tool: never shipped in the mod, so it may use the full toolchain release.
plugins {
    id 'application'
    id 'oriel-java'
}

dependencies {
    implementation(project(':engine'))
    // The Ore theme and presets, so their pages preview with their controllers.
    implementation(project(':kit'))
    implementation(project(path: ':rhino', configuration: 'relocated'))
    // The engine only compiles against Gson (Minecraft provides it in game).
    implementation("com.google.code.gson:gson:${gson_version}")
}

application {
    mainClass = 'dev.oriel.preview.Preview'
}

tasks.named('run', JavaExec) {
    // Page paths in --args are typed relative to the repository root.
    workingDir = rootProject.projectDir
}

tasks.named('test', Test) {
    systemProperty('java.awt.headless', 'true')
    // The goldens, read from the project directory (Snapshots.java); the diffs go to build/snapshots.
    inputs.dir('src/test/snapshots').withPathSensitivity(PathSensitivity.RELATIVE)
    // -Doriel.updateSnapshots=true rewrites goldens; -Doriel.mcJar=... picks the Minecraft jar.
    ['oriel.updateSnapshots', 'oriel.mcJar'].each { key ->
        String value = System.getProperty(key)
        if (value != null) systemProperty(key, value)
    }
    if (System.getProperty('oriel.updateSnapshots') != null) outputs.upToDateWhen { false }
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ['-Xlint:all,-serial,-processing,-options', '-Werror']
}

// `./gradlew :preview:checkUi [-Pui=<dir or page>]`: loads every kit page (or the given ones) headless with its
// controller at 640x360 and 427x240, and fails on an engine or controller error or a missing image; CSS the engine
// did not take as written is listed. The gate to run after editing a page.
tasks.register('checkUi', JavaExec) {
    group = 'verification'
    description = 'Checks every UI page for errors, missing images and CSS diagnostics'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'dev.oriel.preview.Preview'
    workingDir = rootProject.projectDir
    systemProperty('java.awt.headless', 'true')
    args('--check', project.findProperty('ui') ?: 'kit/src/main/resources/assets/oriel/ui')
}
