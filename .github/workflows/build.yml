name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Set external run and test directories
        shell: bash
        run: |
          echo "ORIEL_RUN_DIR=$RUNNER_TEMP/oriel-runs" >> "$GITHUB_ENV"
          echo "ORIEL_TEST_TMP=$RUNNER_TEMP" >> "$GITHUB_ENV"

      # All supported game targets and the API signature inspector use Java 25.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      # Caches Gradle, the Minecraft artifacts and the pinned Rhino source archive (in the Gradle user home).
      - uses: gradle/actions/setup-gradle@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Check backend and release boundaries
        run: node --test tools/backend-boundaries.test.mjs tools/release-boundaries.test.mjs tools/verify-central.test.mjs

      - name: Check smoke result accounting without launching Minecraft
        run: bash tools/test-smoke-all.sh "$RUNNER_TEMP/oriel-smoke-tests"

      # Full matrix, explicit root API/template/boundary gates, and both loaders' server tests.
      - run: |
          ./gradlew build :check -Poriel_slim --stacktrace
          ./gradlew :neoforge:26.1:runGameTestServer --stacktrace

      - name: Check all kit pages strictly in both languages
        run: |
          ./gradlew :preview:checkUi -PuiStrict --stacktrace
          ./gradlew :preview:checkUi -PuiStrict -Plang=en_us --stacktrace

      # The example mods in template/, against this Oriel rather than the released one, so an API change can't
      # break them unnoticed.
      - name: Compile downstream templates
        run: ./gradlew templateCompile -Poriel_slim --stacktrace

      # Rebuild runtime jars with development implementations excluded before uploading artifacts.
      - name: Build and check release jars for all supported targets
        shell: bash
        run: |
          set -euo pipefail
          tasks=()
          for loader in fabric neoforge; do
            for version in 26.1 26.2 26.3; do
              tasks+=(":$loader:$version:jar")
            done
          done
          ./gradlew "${tasks[@]}" -Poriel_release --stacktrace
          core_version=$(awk -F= '$1 == "version" {gsub(/\r/, "", $2); print $2}' gradle.properties)
          full_patch=$(awk -F= '$1 == "oriel_full_patch" {gsub(/\r/, "", $2); print $2}' gradle.properties)
          full_version="${core_version%.0}.${full_patch}"
          for loader in fabric neoforge; do
            for version in 26.1 26.2 26.3; do
              mapfile -t jars < <(find "$loader/versions/$version/build/libs" -maxdepth 1 -type f -name "oriel-$loader-*-$full_version.jar")
              if (( ${#jars[@]} != 1 )); then
                echo "Expected one runtime jar for $loader:$version, got ${#jars[@]}" >&2
                exit 1
              fi
              node tools/check-release.mjs "${jars[0]}"
            done
          done

      - if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v5
        with:
          name: jars
          path: |
            neoforge/versions/*/build/libs/*.jar
            fabric/versions/*/build/libs/*.jar
          if-no-files-found: warn
