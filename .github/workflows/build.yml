name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      # All supported game targets and the API signature inspector use Java 25.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      # Caches Gradle, the Minecraft artifacts and the pinned Rhino source archive (in the Gradle user home).
      - uses: gradle/actions/setup-gradle@v5

      # Full matrix, explicit root API/template/boundary gates, and both loaders' server tests.
      - run: ./gradlew build :check :neoforge:26.1:runGameTestServer --stacktrace

      # The example mods in template/, against this Oriel rather than the released one, so an API change can't
      # break them unnoticed.
      - name: Compile downstream templates
        run: ./gradlew templateCompile --stacktrace

      - if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v5
        with:
          name: jars
          path: |
            neoforge/versions/*/build/libs/*.jar
            fabric/versions/*/build/libs/*.jar
          if-no-files-found: warn
