// The Stonecutter controller (the root project's build script). `stonecutter active` is the version the sources on
// disk are written for; switch it with the "Set active project to ..." tasks, and set it back to the vcs version
// (26.3) before committing.
plugins {
    id 'dev.kikugie.stonecutter'
    // https://maven.fabricmc.net/net/fabricmc/fabric-loom/net.fabricmc.fabric-loom.gradle.plugin/maven-metadata.xml
    // Loom for the supported unobfuscated Minecraft versions.
    id 'net.fabricmc.fabric-loom' version '1.18.2' apply false
    // https://projects.neoforged.net/neoforged/moddevgradle
    id 'net.neoforged.moddev' version '2.0.147' apply false
}

stonecutter.active '26.3'

tasks.register('check') { group = 'verification' }

// Compile real downstream examples against this checkout's artifacts, never the upstream Maven repository.
allprojects {
    plugins.withId('maven-publish') {
        publishing.repositories.maven {
            name = 'TemplateLocal'
            url = rootProject.layout.buildDirectory.dir('template-maven')
        }
    }
}
tasks.register('templateCompile') {
    group = 'verification'
    description = 'Compile both downstream template mods against the current Oriel checkout.'
}
['fabric', 'neoforge'].each { loader ->
    def gate = tasks.register("compileTemplate" + loader.capitalize(), GradleBuild) {
        dir = file("template/" + loader)
        tasks = ['compileJava', 'processResources']
        startParameter.offline = gradle.startParameter.offline
        startParameter.projectProperties = ['orielRepository': layout.buildDirectory.dir('template-maven').get().asFile.absolutePath]
        dependsOn(":" + loader + ':26.3:publishAllPublicationsToTemplateLocalRepository',
                ':engine:publishAllPublicationsToTemplateLocalRepository', ':mc-extension:publishAllPublicationsToTemplateLocalRepository',
                ':script-rhino:publishAllPublicationsToTemplateLocalRepository', ':rhino:publishAllPublicationsToTemplateLocalRepository')
    }
    tasks.named('templateCompile') { dependsOn(gate) }
}
tasks.named('check') { dependsOn('templateCompile') }
tasks.named('check') { dependsOn(':common:26.1:checkPublicApi', ':common:26.2:checkPublicApi', ':common:26.3:checkPublicApi') }
tasks.register('checkBackendBoundaries', Exec) {
    group = 'verification'
    commandLine('node', '--test', rootProject.file('tools/backend-boundaries.test.mjs'))
}
tasks.named('check') { dependsOn('checkBackendBoundaries') }
tasks.named('check') { dependsOn(':engine:test', ':kit:test', ':preview:test') }

// Resolve exactly the build/test runtime classpaths, including native runtime dependencies for this platform.
def verificationClasspaths = []
allprojects { candidate ->
    verificationClasspaths.add(candidate.buildscript.configurations.named('classpath'))
    candidate.configurations.configureEach { configuration ->
        if (configuration.canBeResolved && configuration.name.startsWith('neoForm'))
            verificationClasspaths.add(candidate.configurations.named(configuration.name))
    }
    candidate.plugins.withId('java') {
        ['compileClasspath', 'runtimeClasspath', 'testCompileClasspath', 'testRuntimeClasspath'].each { name ->
            verificationClasspaths.add(candidate.configurations.named(name))
        }
    }
}
tasks.register('verifyDependencyGraph') {
    group = 'verification'
    description = 'Resolve build and runtime graphs for offline SHA-256 dependency verification.'
    doLast {
        verificationClasspaths.each { provider ->
            def configuration = provider.get()
            logger.lifecycle("Resolved " + configuration.name + ": " + configuration.files.size() + " entries")
        }
    }
}

// Unlike Gradle's global --write-verification-metadata mode, this resolves only the actual graphs above.
// Loom's global write mode requests uncached optional-platform descriptors even on an offline Windows build.
def verificationFile = layout.projectDirectory.file('gradle/verification-metadata.xml').asFile
def dependencyCache = new File(gradle.gradleUserHomeDir, 'caches/modules-2/files-2.1')
tasks.register('writeDependencyVerification') {
    group = 'verification'
    description = 'Refresh SHA-256 trust from the resolved offline cache; review the XML diff before committing.'
    doLast {
        def artifacts = new TreeMap<String, Map>()
        def add = { String group, String module, String version, File file ->
            def key = group + ':' + module + ':' + version
            def component = artifacts.computeIfAbsent(key) { [group:group, name:module, version:version, files:new TreeMap<String, Set>()] }
            def digest = java.security.MessageDigest.getInstance('SHA-256')
            file.withInputStream { input ->
                byte[] buffer = new byte[65536]
                int n
                while ((n = input.read(buffer)) > 0) digest.update(buffer, 0, n)
            }
            component.files.computeIfAbsent(file.name) { new TreeSet<String>() }.add(digest.digest().encodeHex().toString())
        }
        verificationClasspaths.each { provider ->
            provider.get().incoming.artifacts.artifacts.each { artifact ->
                def id = artifact.id.componentIdentifier
                if (id instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier)
                    add(id.group, id.module, id.version, artifact.file)
            }
        }
        // The settings-only toolchain resolver isn't on a project classpath; pin its one declared version too.
        [['org.gradle.toolchains', 'foojay-resolver', '1.0.0'], ['dev.kikugie', 'stonecutter', '0.9.8']].each { coordinates ->
            def cached = new File(dependencyCache, coordinates.join('/'))
            cached.eachFileRecurse { file ->
                if (file.name.endsWith('.jar')) add(coordinates[0], coordinates[1], coordinates[2], file)
            }
        }
        def writer = new StringWriter()
        def xml = new groovy.xml.MarkupBuilder(writer)
        xml.mkp.xmlDeclaration(version:'1.0', encoding:'UTF-8')
        xml.'verification-metadata'(xmlns:'https://schema.gradle.org/dependency-verification') {
            configuration {
                'verify-metadata'('false')
                'verify-signatures'('false')
            }
            xml.components {
                artifacts.values().each { entry ->
                    component(group:entry.group, name:entry.name, version:entry.version) {
                        entry.files.each { name, hashes ->
                            artifact(name:name) {
                                hashes.each { hash -> sha256(value:hash, origin:'Offline resolved cache; review required') }
                            }
                        }
                    }
                }
            }
        }
        verificationFile.parentFile.mkdirs()
        verificationFile.setText(writer.toString() + System.lineSeparator(), 'UTF-8')
        logger.lifecycle('Wrote SHA-256 verification for ' + artifacts.size() + ' resolved components')
    }
}

stonecutter.parameters { sc ->
    // The version's settings from stonecutter.properties.toml become project properties.
    sc.properties.tags(sc.current.version)

    // 26.2 moved the entity type constants from EntityType to EntityTypes. The import keeps a note, so it can go back.
    boolean entityTypes = sc.current.parsed >= '26.2'
    sc.replacements.regex(entityTypes) { spec ->
        spec.replace('\\bEntityType\\.([A-Z][A-Z0-9_]*)\\b', 'EntityTypes.$1', '\\bEntityTypes\\.([A-Z][A-Z0-9_]*)\\b', 'EntityType.$1')
    }
    sc.replacements.regex(entityTypes) { spec ->
        spec.replace('import net\\.minecraft\\.world\\.entity\\.EntityType; // EntityTypes', 'import net.minecraft.world.entity.EntityTypes;',
                'import net\\.minecraft\\.world\\.entity\\.EntityTypes;', 'import net.minecraft.world.entity.EntityType; // EntityTypes')
    }
    // Windows keys: SDL on 26.3, GLFW on 26.1/26.2.
    String metaKeys = '\\bKEY_([LR])(?:GUI|SUPER)\\b'
    String metaKey = 'KEY_$1' + (sc.current.parsed >= '26.3' ? 'GUI' : 'SUPER')
    sc.replacements.regex(true) { spec ->
        spec.replace(metaKeys, metaKey, metaKeys, metaKey)
    }
    // 26.3 moved the render pipeline, texture and vertex format types from blaze3d to renderpearl. PrimitiveTopology
    // moved to another sub-package as well, so SdfRenderState imports it per version.
    String renderpearlTypes = '(GpuFormat|pipeline\\.(?:RenderPipeline|BlendFunction|ColorTargetState)|textures\\.FilterMode|vertex\\.VertexFormat)'
    sc.replacements.regex(sc.current.parsed >= '26.3') { spec ->
        spec.replace("\\bcom\\.mojang\\.blaze3d\\.$renderpearlTypes\\b", 'com.mojang.renderpearl.api.$1',
                "\\bcom\\.mojang\\.renderpearl\\.api\\.$renderpearlTypes\\b", 'com.mojang.blaze3d.$1')
    }

}

// maven.maxleiter.com is a static site (the MaxLeiter/maven repo on GitHub Pages). The release workflow checks it out
// and publishes every artifact into it with -Poriel_maven_dir=<checkout>: publishAllPublicationsToOrielMavenRepository.
def orielMavenDir = findProperty('oriel_maven_dir')
if (orielMavenDir) {
    allprojects {
        plugins.withId('maven-publish') {
            publishing.repositories.maven {
                name = 'orielMaven'
                url = rootProject.file(orielMavenDir).toURI()
            }
        }
    }
}
