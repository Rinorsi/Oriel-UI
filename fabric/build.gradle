plugins {
    id 'multiloader-loader'
}

// All supported Minecraft versions are unobfuscated.
apply plugin: 'net.fabricmc.fabric-loom'

// Access widening changes module names and generated bytes; exclude only local Loom output.
def minecraftPins = new groovy.json.JsonSlurper().parse(rootProject.file('gradle/generated-minecraft.json'))
if (minecraftPins.schemaVersion != 2 || minecraftPins.policy != 'exclude-local-loom-output')
    throw new GradleException('Unsupported gradle/generated-minecraft.json schema; review the local Loom exclusions')
def minecraftPin = minecraftPins.entries.find { it.version == minecraft_version.toString() }
if (minecraftPin == null) throw new GradleException('Minecraft ' + minecraft_version
        + ': gradle/generated-minecraft.json: expected a local Loom exclusion, actual missing. '
        + 'Review the Minecraft/Loom upgrade, add the version/file patterns, then run writeDependencyVerification and review the XML diff.')
def generatedMinecraft = configurations.compileClasspath.incoming.artifactView {
    componentFilter { id ->
        id instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier
                && id.group == 'net.minecraft' && id.module.startsWith('minecraft-merged-')
    }
}.files
def minecraftContentGate = tasks.register('verifyMinecraftContent', dev.oriel.buildlogic.VerifyMinecraftContent) {
    group = 'verification'
    description = 'Check that excluded Minecraft artifacts are local Loom outputs for this version.'
    minecraftJars.from(generatedMinecraft)
    minecraftVersion.set(minecraft_version.toString())
    expectedFilePattern.set(minecraftPin.file)
    localRepository.set(rootProject.layout.projectDirectory.dir('.gradle/loom-cache/minecraftMaven'))
}
tasks.withType(JavaCompile).configureEach { dependsOn(minecraftContentGate) }
rootProject.tasks.named('check') { dependsOn(minecraftContentGate) }

dependencies {
    minecraft("com.mojang:minecraft:${minecraft_version}")
    implementation("net.fabricmc:fabric-loader:${fabric_loader_version}")
    implementation("net.fabricmc.fabric-api:fabric-api:${fabric_version}")
}

fabricApi {
    // Runs the shared GameTests (common gametest/) on a headless server.
    configureTests {
        createSourceSet = false
        modId = mod_id
        enableGameTests = true
        enableClientGameTests = false
        eula = false
    }
}

loom {
    // Common's access widener, with its Stonecutter comments resolved for this version.
    accessWidenerPath.set(stonecutter.process(rootProject.file("common/src/main/resources/${mod_id}.accesswidener"),
            "build/stonecutter-processed/${mod_id}.accesswidener"))
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDirectory.set(orielRunDir('client'))
            // -Pautopilot and -Ptour (multiloader-loader.gradle).
            clientRunProperties.each { key, value -> property(key, value) }
            programArgs(clientRunArgs)
        }
        server {
            server()
            programArg('--nogui')
            if (project.hasProperty('serverProbe')) property('oriel.serverProbe', 'true')
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDirectory.set(orielRunDir('server'))
        }
    }
}

// The GameTest run that fabricApi.configureTests adds lives outside the repository too.
loom.runs.configureEach { run ->
    if (run.name.toLowerCase(Locale.ROOT).contains('gametest')) {
        run.runDirectory.set(orielRunDir(run.name))
        run.property('oriel.componentCodecFixtures', 'true')
    }
}

// The mcgradleconventions loader attribute (multiloader-common.gradle) on Loom's configurations too.
loaderAttributeOn('includeInternal', 'modCompileClasspath')
