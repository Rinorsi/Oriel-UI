modLoader = "javafml"
loaderVersion = "${neoforge_loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_version},)"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
side = "BOTH"

# Required: launchers install Oriel along with your mod. Also list it as a required dependency on your Modrinth and
# CurseForge pages.
# Previous 0.9 API: [0.9.0,0.10.0). This template uses the incompatible 0.10 API boundary.
[[dependencies.${mod_id}]]
modId = "oriel"
type = "required"
versionRange = "[0.10.0,0.11.0)"
side = "BOTH"
