modLoader = "javafml"
loaderVersion = "${neoforge_loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_version},)"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
side = "BOTH"

# Required: launchers install Oriel along with your mod. Also list it as a required dependency on your Modrinth and
# CurseForge pages.
# The 0.12 range accepts slim 0.12.0 and full 0.12.1; older consumers must migrate and verify.
[[dependencies.${mod_id}]]
modId = "oriel"
type = "required"
versionRange = "[0.12.0,0.13.0)"
side = "BOTH"
