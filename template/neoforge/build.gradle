plugins {
    id 'java-library'
    // https://projects.neoforged.net/neoforged/moddevgradle
    id 'net.neoforged.moddev' version '2.0.147'
}

version = mod_version
group = mod_group_id
base.archivesName = mod_id

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

repositories {
    maven { url = uri(findProperty('orielRepository') ?: '../../build/template-maven') }
    mavenLocal()
}

neoForge {
    version = neoforge_version
    runs {
        client {
            client()
            gameDirectory = file('runs/client')
        }
        if (project.hasProperty('jijAcceptance')) {
            server {
                server()
                gameDirectory = file(project.property('jijRunDir'))
                programArguments.add('--nogui')
                systemProperty('oriel.jijProbe', 'true')
            }
        }
    }
    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

def embeddedOption = providers.gradleProperty('orielEmbedded').getOrElse('false')
if (!(embeddedOption in ['true', 'false'])) throw new GradleException('orielEmbedded must be true or false')
// Acceptance runs load their independently prepared parent jars from mods/.
def orielEmbedded = embeddedOption == 'true' && !project.hasProperty('jijAcceptance')
if (oriel_version != '0.15.0')
    throw new GradleException('Compile and embed against the slim version 0.15.0; full jars are player distributions')

dependencies {
    def oriel = "dev.oriel:oriel-neoforge-${minecraft_version}:${oriel_version}"
    if (project.hasProperty('jijAcceptance')) compileOnly(oriel) { transitive = false }
    else implementation(oriel) { transitive = false }
    if (orielEmbedded) {
        jarJar("dev.oriel:oriel-neoforge-${minecraft_version}") {
            transitive = false
            version {
                strictly('[0.15.0,0.16.0)')
                prefer(oriel_version)
            }
        }
    }
}

// Fail if range resolution selects a higher full version from a stale repository.
configurations.jarJar.incoming.afterResolve {
    configurations.jarJar.resolvedConfiguration.resolvedArtifacts.each { artifact ->
        def id = artifact.moduleVersion.id
        if (id.group == 'dev.oriel' && id.name == "oriel-neoforge-${minecraft_version}" && id.version != oriel_version)
            throw new GradleException("Refusing to embed non-slim Oriel ${id.version}; expected ${oriel_version}")
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

processResources {
    def props = [minecraft_version_range: minecraft_version_range, neoforge_version: neoforge_version,
                 neoforge_loader_version_range: neoforge_loader_version_range, oriel_version: oriel_version,
                 mod_id: mod_id, mod_name: mod_name, mod_version: mod_version, mod_authors: mod_authors,
                 mod_description: mod_description, mod_license: mod_license]
    inputs.properties(props)
    filesMatching('META-INF/neoforge.mods.toml') { expand(props) }
}
