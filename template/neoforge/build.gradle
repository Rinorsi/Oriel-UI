plugins {
    id 'java-library'
    // https://projects.neoforged.net/neoforged/moddevgradle
    id 'net.neoforged.moddev' version '2.0.147'
}

version = mod_version
group = mod_group_id
base.archivesName = mod_id

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

repositories {
    maven { url = uri(findProperty('orielRepository') ?: '../../build/template-maven') }
    mavenLocal()
}

neoForge {
    version = neoforge_version
    runs {
        client {
            client()
            gameDirectory = file('runs/client')
        }
    }
    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    // Oriel for this Minecraft version, installed by players as its own mod. To bundle it in this mod's jar
    // instead: jarJar(implementation("dev.oriel:oriel-neoforge-${minecraft_version}:${oriel_version}"))
    implementation "dev.oriel:oriel-neoforge-${minecraft_version}:${oriel_version}"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

processResources {
    def props = [minecraft_version_range: minecraft_version_range, neoforge_version: neoforge_version,
                 neoforge_loader_version_range: neoforge_loader_version_range, oriel_version: oriel_version,
                 mod_id: mod_id, mod_name: mod_name, mod_version: mod_version, mod_authors: mod_authors,
                 mod_description: mod_description, mod_license: mod_license]
    inputs.properties(props)
    filesMatching('META-INF/neoforge.mods.toml') { expand(props) }
}
