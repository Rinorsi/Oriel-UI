// Optional implementation of ScriptRuntime; the core does not depend on this module.
plugins {
    id 'java-library'
    id 'oriel-java'
    id 'maven-publish'
}

if (project.hasProperty('oriel_release')) {
    tasks.named('jar', Jar) { exclude('dev/oriel/engine/script/InspectorBindings*.class') }
}

dependencies {
    api(project(':engine'))
    implementation(project(path: ':rhino', configuration: 'relocated'))
    compileOnly('com.google.code.gson:gson:' + gson_version)
}

tasks.withType(JavaCompile).configureEach {
    options.release = engine_java_release as int
    options.compilerArgs += ['-Xlint:all,-serial,-processing,-options', '-Werror']
    options.debugOptions.debugLevel = 'source,lines'
}

configurations {
    scriptClasses { canBeResolved = false; canBeConsumed = true }
}
artifacts {
    scriptClasses(tasks.named('compileJava').flatMap { it.destinationDirectory })
    scriptClasses(sourceSets.main.output.resourcesDir) { builtBy(tasks.named('processResources')) }
}

java { withSourcesJar() }

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId = 'oriel-script-rhino'
            from components.java
        }
    }
}
