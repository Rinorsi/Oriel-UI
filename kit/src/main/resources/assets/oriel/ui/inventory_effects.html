<!doctype html>
<html>
<head>
  <title>Effects beside the inventory</title>
  <link rel="stylesheet" href="ore.css">
  <style>
    /*
     * The player's effects beside vanilla's survival and creative inventories, in place of vanilla's list
     * (InventoryEffects in the mod places it: x, y, width and the height it may take). The rows are the potion HUD's
     * full panel, grouped into beneficial, harmful and neutral; a narrow place folds the groups to strips of icons.
     */
    body { margin: 0; background: transparent; }
    .side {
      position: absolute; left: 0; top: 0; width: 124px; max-height: 166px;
      display: flex; flex-direction: column;
      border: 2px solid transparent; border-image: url(../textures/ore/panel.png) 2 fill;
      box-shadow: 0 3px 0 rgba(0, 0, 0, 0.45);
      animation: side-in 220ms var(--o-ease-out) backwards;
    }
    @keyframes side-in { from { opacity: 0; transform: translateX(-6px); } }
    .side .title {
      flex: none; display: flex; align-items: center; gap: 4px; height: 15px; padding: 0 4px;
      color: var(--o-text); -mc-tint: var(--o-text-faint);
      border-bottom: 1px solid var(--o-line-strong); box-shadow: 0 1px 0 var(--o-line);
    }
    .side .o-effects { flex: 0 1 auto; min-height: 0; padding: 3px; overflow-y: auto; }
    .side.narrow .title span { display: none; }
  </style>
</head>
<body>
<div class="side" id="side">
  <div class="title"><img class="o-ico" src="../textures/icons/flask.png"><span>状态效果</span></div>
  <div class="o-effects o-scroll" id="panel"></div>
</div>
</body>
</html>
