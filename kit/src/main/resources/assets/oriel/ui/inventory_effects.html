<!doctype html>
<html>
<head>
  <title>Effects beside the inventory</title>
  <link rel="stylesheet" href="ore.css">
  <style>
    /*
     * The player's effects beside vanilla's survival and creative inventories, in place of vanilla's list
     * (InventoryEffects in the mod places it: x, y, width and the height it may take, no taller than the inventory).
     * The panel is the potion HUD's, grouped into beneficial, harmful and neutral; a group of more than four effects,
     * or every group in a narrow place, shows as icon chips, each with the effect's card on hover. It scrolls inside.
     */
    body { margin: 0; background: transparent; }
    .side {
      position: absolute; left: 0; top: 0; width: 124px; max-height: 166px;
      display: flex; flex-direction: column;
      border: 2px solid transparent; border-image: url(../textures/ore/panel.png) 2 fill;
      box-shadow: 0 3px 0 rgba(0, 0, 0, 0.45);
      animation: side-in 220ms var(--o-ease-out) backwards;
    }
    @keyframes side-in { from { opacity: 0; transform: translateX(-6px); } }
    .side .title {
      flex: none; display: flex; align-items: center; gap: 4px; height: 15px; padding: 0 4px;
      color: var(--o-text); -mc-tint: var(--o-text-faint);
      border-bottom: 1px solid var(--o-line-strong); box-shadow: 0 1px 0 var(--o-line);
    }
    .side .o-effects { flex: 0 1 auto; min-height: 0; padding: 3px; overflow-y: auto; }
    .side.narrow .title span { display: none; }
    /* What the view leaves out (the controller marks it): a shade at that edge, so a cut-off list reads as scrollable. */
    .side::before, .side::after { content: ""; position: absolute; left: 0; right: 0; height: 12px; pointer-events: none; opacity: 0;
      transition: opacity 160ms; }
    .side::before { top: 16px; background: linear-gradient(rgba(0, 0, 0, 0.55), rgba(0, 0, 0, 0)); }
    .side::after { bottom: 0; background: linear-gradient(rgba(0, 0, 0, 0), rgba(0, 0, 0, 0.6)); }
    .side.more-above::before, .side.more-below::after { opacity: 1; }
  </style>
</head>
<body>
<div class="side" id="side">
  <div class="title"><img class="o-ico" src="../textures/icons/flask.png"><span data-i18n="oriel.ui.inventory_effects.title">oriel.ui.inventory_effects.title</span></div>
  <div class="o-effects o-scroll" id="panel"></div>
</div>
</body>
</html>
