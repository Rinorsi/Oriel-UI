<!doctype html>
<html>
<head>
<title>设置</title>
<link rel="stylesheet" href="ore.css">
<style>
.settings { width: 360px; }
.ore-tabs { margin-bottom: -2px; position: relative; z-index: 1; padding-left: 4px; }
.content { height: 148px; overflow-y: auto; padding: 4px; }
.rows { display: flex; flex-direction: column; gap: 2px; }
.ore-row { display: flex; align-items: center; gap: 8px; min-height: 22px; padding: 0 4px; transition: background-color var(--ore-fast); }
.ore-row:hover { background: rgba(255, 255, 255, 0.05); }
.ore-row .label { width: 104px; flex-shrink: 0; display: flex; gap: 3px; align-items: center; }
.ore-row .label .dot { color: var(--ore-green-3); opacity: 0; transition: opacity var(--ore-medium); }
.ore-row.changed .label .dot { opacity: 1; }
.ore-row .control { flex-grow: 1; display: flex; align-items: center; gap: 6px; }
.ore-row .val { width: 44px; text-align: right; color: var(--ore-text-dim); }
.ore-row .help { color: var(--ore-text-faint); }
.ore-row input.ore-field { flex-grow: 1; }
.ore-row .ore-select { flex-grow: 1; }
.section { color: var(--ore-text-faint); margin: 4px 4px 1px; }
.rows.swap { animation: ore-rise 0.22s var(--ore-ease); }
.ore-row.flash { animation: flash 0.5s ease-out; }
@keyframes flash { from { background-color: rgba(108, 195, 73, 0.35); } to { background-color: rgba(108, 195, 73, 0); } }
.foot { display: flex; align-items: center; gap: 6px; margin-top: 8px; }
</style>
</head>
<body>
<div class="ore-screen">
  <div class="ore-panel settings ore-enter">
    <div class="ore-header">
      <div class="ore-btn icon" id="back" tabindex="0">‹</div>
      <div class="ore-title">设置</div>
      <div class="ore-spacer"></div>
      <div class="ore-faint">Tab 切换焦点 · 方向键调整</div>
      <div class="ore-btn icon" id="close" tabindex="0">×</div>
    </div>
    <div class="ore-tabs" id="tabs"></div>
    <div class="ore-panel content" id="content"><div class="rows" id="rows"></div></div>
    <div class="foot">
      <div class="ore-btn destructive" id="reset" tabindex="0">恢复默认</div>
      <span class="ore-faint" id="status">没有修改</span>
      <div class="ore-spacer"></div>
      <div class="ore-btn" id="cancel" tabindex="0">取消</div>
      <div class="ore-btn primary" id="done" tabindex="0">完成</div>
    </div>
  </div>
</div>
</body>
</html>
