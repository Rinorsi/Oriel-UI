<!doctype html>
<html>
<head>
<title>优易库 · Oriel UI</title>
<link rel="stylesheet" href="ore.css">
<style>
/* The launcher, in the same window as every other page (moving between pages changes only the content). Left: the
   hero, a pixel night landscape with the headline. Right: the
   destinations, one row each, every row with a live preview that grows with the row, so a large GUI gets bigger
   previews rather than empty tiles. */

/* Title bar: brand and tabs (shared with the other top-level pages), key hints, the look switches. */
.o-seg > span { gap: 3px; }

.home-body { flex: 1; min-width: 0; display: flex; gap: 6px; padding: 6px; }

/* Hero: one picture, a headline and two buttons, with room to breathe. The picture leaves the upper left open for
   the words; it stays a night scene in both themes, so its text is always light. */
.hero { flex: 1.35; min-width: 0; position: relative; overflow: hidden; background-color: #1b1838;
    background-image: url(../textures/ui/hero_bg.png); background-size: cover; background-position: 78% 50%; image-rendering: pixelated;
    animation: m-pop var(--m-slow) var(--m-spring) both; }
.hero .scrim { position: absolute; left: 0; top: 0; right: 0; bottom: 0; pointer-events: none;
    background: radial-gradient(ellipse at 0% 20%, rgba(14, 12, 34, 0.55), rgba(14, 12, 34, 0) 60%); }
.hero .pitch { position: absolute; left: 7%; top: 13%; right: 30%; display: flex; flex-direction: column; align-items: flex-start; gap: 10px;
    animation: fx-rise 700ms var(--o-ease-out) 120ms both; }
.hero .tag { color: #b9b2e0; letter-spacing: 1px; white-space: nowrap; }
.hero .o-h1 { color: #ffffff; text-shadow: 1px 1px 0 rgba(0, 0, 0, 0.5); }
.hero .o-h1 em { font-style: normal; color: #a8f2dc; }
.hero .actions { display: flex; gap: 4px; margin-top: 4px; }
.hero .actions .ore-btn { flex: none; white-space: nowrap; min-height: 18px; padding: 0 8px; }

/* Destinations. */
.dests { flex: 1; min-width: 150px; display: flex; flex-direction: column; gap: 4px; }
.card { position: relative; flex: 1; min-height: 0; overflow: hidden; display: flex; align-items: center; gap: 6px; padding: 3px 3px 3px 6px;
    animation: m-pop var(--m-slow) var(--m-spring) both; }
.card .ic { flex: none; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; background: var(--o-well); border: 1px solid var(--o-line-strong); }
.card .ic .o-ico { -mc-tint: var(--o-text-dim); transition: -mc-tint 160ms; }
.card.hot:hover .ic .o-ico, .card.hot:focus .ic .o-ico { -mc-tint: var(--o-accent-strong); }
.card .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.card .label { color: var(--o-text); }
.card .sub { color: var(--o-text-dim); line-height: 10px; }
/* The live preview: a recessed well at the row's right end, as tall as the row. */
.card .thumb { position: relative; flex: none; align-self: stretch; width: 38%; overflow: hidden; background: var(--o-well); border: 1px solid var(--o-line); }
.card .go { position: absolute; right: 4px; top: 50%; margin-top: -8px; opacity: 0; transform: translateX(-4px); transition: opacity 160ms, transform 160ms var(--m-out); -mc-tint: var(--o-text); }
.card:hover .go { opacity: 1; transform: none; }
.card:hover .thumb { border-color: var(--o-line-strong); }

.inv entity { position: absolute; left: 0; top: 0; right: 0; bottom: 0; -mc-entity-focus: center; -mc-model-scale: 1.7; -mc-pitch: 6deg; }
.forge model { position: absolute; left: 10%; top: 4%; width: 80%; height: 92%; -mc-yaw: 30deg; -mc-pitch: 24deg; transition: -mc-yaw 700ms var(--m-spring); }
.forge:hover model { -mc-yaw: 210deg; }
.editor model { position: absolute; right: 2%; top: 8%; width: 40%; height: 84%; -mc-yaw: 30deg; -mc-pitch: 24deg; transition: -mc-yaw 700ms var(--m-spring); }
.editor:hover model { -mc-yaw: 210deg; }

.spectrum { position: absolute; left: 6px; right: 6px; top: 4px; bottom: 4px; display: flex; align-items: flex-end; gap: 2px; }
.spectrum i { flex: 1; height: 30%; background: repeating-linear-gradient(to top, var(--o-accent-strong) 0 2px, rgba(0, 0, 0, 0) 2px 3px);
    animation: band 900ms ease-in-out infinite alternate; }
@keyframes band { from { height: 15%; } to { height: 95%; } }
.spectrum i:nth-child(2) { animation-delay: -0.5s; }
.spectrum i:nth-child(3) { animation-delay: -0.3s; }
.spectrum i:nth-child(4) { animation-delay: -0.8s; }
.spectrum i:nth-child(5) { animation-delay: -0.2s; }
.spectrum i:nth-child(6) { animation-delay: -0.6s; }
.spectrum i:nth-child(7) { animation-delay: -0.4s; }
.spectrum i:nth-child(8) { animation-delay: -0.9s; }

/* The game's own effect textures (any mod's effect has one at <namespace>:textures/mob_effect/<path>.png). */
.effs { position: absolute; left: 0; top: 0; right: 0; bottom: 0; display: flex; align-items: center; justify-content: center; gap: 2px; }
.effs span { position: relative; width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; background: rgba(0, 0, 0, 0.3); border: 1px solid var(--o-line-strong); }
.effs span.good { border-bottom-color: #6cc349; }
.effs span.bad { border-bottom-color: #e25a5a; }
.effs img { width: 16px; height: 16px; }

.mock { position: absolute; left: 4px; top: 4px; bottom: 4px; right: 44%;
    background-image: repeating-linear-gradient(to right, var(--o-line) 0 1px, rgba(0, 0, 0, 0) 1px 6px), repeating-linear-gradient(var(--o-line) 0 1px, rgba(0, 0, 0, 0) 1px 6px); }
.mock i { position: absolute; background: var(--o-tile); border: 1px solid var(--o-tile-edge); }
.mock .a { left: 8%; top: 12%; width: 60%; height: 26%; }
.mock .b { left: 8%; top: 50%; width: 26%; height: 38%; }
.mock .c { left: 42%; top: 50%; width: 46%; height: 38%; border-color: var(--o-accent-strong); animation: nudge 3.2s var(--m-out) infinite; }
@keyframes nudge { 0%, 40% { left: 42%; } 60%, 100% { left: 50%; } }

.settings .thumb { display: flex; flex-direction: column; justify-content: center; gap: 3px; padding: 0 6px; }
.settings .thumb div { display: flex; align-items: center; justify-content: space-between; color: var(--o-text-dim); }

.dests > .card:nth-child(1) { animation-delay: 60ms; }
.dests > .card:nth-child(2) { animation-delay: 100ms; }
.dests > .card:nth-child(3) { animation-delay: 140ms; }
.dests > .card:nth-child(4) { animation-delay: 180ms; }
.dests > .card:nth-child(5) { animation-delay: 220ms; }
.dests > .card:nth-child(6) { animation-delay: 260ms; }

/* Small GUIs (427×240 is 1280×720 at GUI scale 3): icons only in the title bar, one line per row. */
@media (max-width: 560px) {
    .o-seg em { display: none; }
}
@media (max-width: 700px) { .o-hints { display: none; } }
[data-window=mini] .o-hints { display: none; }
@media (max-height: 300px) {
    .card .sub { display: none; }
    .hero .pitch { left: 10px; top: 12px; right: 6px; gap: 6px; }
    .settings .thumb div:nth-child(2) { display: none; }
    .settings .thumb div { justify-content: center; font-size: 0; }
    .effs span:nth-child(n+4) { display: none; }
}
/* Large GUIs, maximized (the window mode decides the room, not only the screen): a bigger headline, roomier rows. */
@media (min-width: 760px) and (min-height: 400px) {
    [data-window=max] .hero .pitch { gap: 12px; }
    [data-window=max] .hero .o-h1 { font-size: 24px; line-height: 26px; }
    [data-window=max] .card { gap: 8px; padding: 4px 4px 4px 8px; }
    [data-window=max] .card .ic { width: 28px; height: 28px; }
    [data-window=max] .effs span { width: 22px; height: 22px; }
}
</style>
</head>
<body>
<div class="o-app">
<div class="o-window" id="home">
  <div class="o-titlebar">
    <div class="o-brand"><img src="../textures/ui/emblem.png"><b>优易库</b><span>Oriel UI</span></div>
    <div class="o-apptabs" id="nav">
      <div class="on" data-go="gallery"><img class="o-ico" src="../textures/icons/home.png"><em>首页</em></div>
      <div data-go="catalog"><img class="o-ico" src="../textures/icons/grid.png"><em>组件与动效</em></div>
      <div data-go="editor"><img class="o-ico" src="../textures/icons/layers.png"><em>编辑器</em></div>
      <i class="m-indicator" id="indicator"></i>
    </div>
    <div class="o-grow"></div>
    <div class="o-hints"><span><span class="o-kbd">T</span>主题</span><span><span class="o-kbd">Tab</span>焦点</span><span><span class="o-kbd">Esc</span>关闭</span></div>
    <div class="o-seg">
      <span data-style-pick="ore" title="像素斜角"><img class="o-ico" src="../textures/icons/grid.png"><em>像素</em></span>
      <span data-style-pick="smooth" title="圆角与柔和阴影"><img class="o-ico" src="../textures/icons/layers.png"><em>平滑</em></span>
    </div>
    <div class="o-seg" id="theme-seg">
      <span class="dark on" data-theme-pick="dark" title="暗色"><img class="o-ico" src="../textures/icons/moon.png"><em>暗</em></span>
      <span class="light" data-theme-pick="light" title="亮色"><img class="o-ico" src="../textures/icons/sun.png"><em>亮</em></span>
    </div>
    <div class="ore-btn icon" id="close" data-action="close" tabindex="0"><img class="o-ico" src="../textures/icons/close.png"></div>
  </div>

  <div class="o-body">
  <div class="home-body">
    <div class="hero o-tile">
      <canvas class="fx" data-fx="stars" data-rate="2" data-seed="11"></canvas>
      <div class="scrim"></div>
      <div class="pitch">
        <div class="tag">0.2 预览 · Minecraft 26.1 – 26.3</div>
        <div class="o-h1">用网页的方式<br><em>做 Minecraft 界面</em></div>
        <div class="actions">
          <div class="ore-btn hero m-ripple" data-go="inventory" data-zoom tabindex="0"><img class="o-ico" src="../textures/icons/play.png">开始体验</div>
          <div class="ore-btn secondary m-ripple" data-go="catalog" tabindex="0"><img class="o-ico" src="../textures/icons/grid.png">组件目录</div>
        </div>
      </div>
    </div>

    <div class="dests" id="cards">
      <div class="card inv o-tile hot m-spot" tabindex="0" data-go="inventory" data-zoom>
        <div class="ic"><img class="o-ico" src="../textures/icons/bag.png"></div>
        <div class="txt"><div class="label">背包</div></div>
        <div class="thumb"><entity player follow-mouse></entity></div>
      </div>
      <div class="card forge o-tile hot m-spot" tabindex="0" data-go="forge" data-zoom>
        <div class="ic"><img class="o-ico" src="../textures/icons/hammer.png"></div>
        <div class="txt"><div class="label">锻造台</div></div>
        <div class="thumb"><canvas class="fx" data-fx="embers" data-rate="7" data-seed="2"></canvas><model block="minecraft:anvil"></model></div>
      </div>
      <div class="card hud o-tile hot m-spot" tabindex="0" data-page="potions">
        <div class="ic"><img class="o-ico" src="../textures/icons/flask.png"></div>
        <div class="txt"><div class="label">药水 HUD</div></div>
        <div class="thumb"><div class="effs">
          <span class="good"><img src="minecraft:textures/mob_effect/speed.png"></span>
          <span class="good"><img src="minecraft:textures/mob_effect/strength.png"></span>
          <span class="bad"><img src="minecraft:textures/mob_effect/poison.png"></span>
          <span class="good"><img src="minecraft:textures/mob_effect/night_vision.png"></span>
        </div></div>
      </div>
      <div class="card music o-tile hot m-spot" tabindex="0" data-go="music" data-zoom>
        <div class="ic"><img class="o-ico" src="../textures/icons/music.png"></div>
        <div class="txt"><div class="label">音乐播放器</div></div>
        <div class="thumb"><div class="spectrum"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div></div>
      </div>
      <div class="card editor o-tile hot m-spot" tabindex="0" data-go="editor" data-zoom>
        <div class="ic"><img class="o-ico" src="../textures/icons/layers.png"></div>
        <div class="txt"><div class="label">组件编辑器</div></div>
        <div class="thumb"><div class="mock"><i class="a"></i><i class="b"></i><i class="c"></i></div><model block="minecraft:crafting_table"></model></div>
      </div>
      <div class="card settings o-tile hot m-spot" tabindex="0" data-go="settings" data-zoom>
        <div class="ic"><img class="o-ico" src="../textures/icons/gear.png"></div>
        <div class="txt"><div class="label">设置</div></div>
        <div class="thumb"><div>垂直同步<span class="ore-toggle on"></span></div><div>粒子效果<span class="ore-toggle on"></span></div></div>
      </div>
    </div>
  </div>
  </div>
</div>
</div>
</body>
</html>
