<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>未来科技</title>
<link rel="stylesheet" href="showcase.css">
<style>
/*
 * A starship's bridge console, in the cyberpunk and space-opera line: a floor grid running to the horizon (rays from
 * the vanishing point, rows closing in toward it), a glass panel with cut corners and a cyan edge, system gauges,
 * a terminal that types and blinks, a segmented energy ring, and a ticker. Pink is the alert colour.
 */
:root { --cy: #5ff3ff; --cy-lo: rgba(95, 243, 255, 0.25); --pk: #ff3d9a; --tx: #d9fbff; --dim: rgba(217, 251, 255, 0.5); --bg: #050a18; }
.bridge { --vx: 58%; --hz: 44%; position: absolute; inset: 0; overflow: hidden; color: var(--tx); font-size: 8px;
    background: radial-gradient(ellipse 70% 55% at var(--vx) var(--hz), #1b2a66, #0b1434 45%, var(--bg) 80%); }
/* Stars, faint, above the horizon. */
.stars { position: absolute; left: 0; right: 0; top: 0; height: var(--hz);
    background: radial-gradient(circle at 12% 30%, #fff 0 0.6px, transparent 1px), radial-gradient(circle at 31% 14%, #cfe 0 0.5px, transparent 1px),
        radial-gradient(circle at 44% 52%, #fff 0 0.5px, transparent 1px), radial-gradient(circle at 73% 22%, #fff 0 0.7px, transparent 1.2px),
        radial-gradient(circle at 86% 61%, #cfe 0 0.5px, transparent 1px), radial-gradient(circle at 64% 8%, #fff 0 0.5px, transparent 1px),
        radial-gradient(circle at 22% 70%, #fff 0 0.4px, transparent 1px), radial-gradient(circle at 93% 34%, #fff 0 0.5px, transparent 1px);
    -webkit-mask-image: linear-gradient(#000 40%, transparent); mask-image: linear-gradient(#000 40%, transparent);
    animation: twinkle 3.2s ease-in-out infinite; }
@keyframes twinkle { 50% { opacity: 0.55; } }
/* The floor: rays from the vanishing point, and rows that close in toward the horizon. */
.floor { position: absolute; left: -12%; right: -28%; top: var(--hz); bottom: 0;
    background: repeating-conic-gradient(from 90deg at 50% 0%, rgba(95, 243, 255, 0.0) 0deg 5.4deg, rgba(95, 243, 255, 0.5) 5.4deg 5.7deg),
        linear-gradient(transparent 0 6%, rgba(95, 243, 255, 0.5) 6% 6.6%, transparent 6.6% 14%, rgba(95, 243, 255, 0.45) 14% 14.8%,
            transparent 14.8% 25%, rgba(95, 243, 255, 0.4) 25% 26%, transparent 26% 41%, rgba(95, 243, 255, 0.35) 41% 42.3%,
            transparent 42.3% 63%, rgba(95, 243, 255, 0.3) 63% 64.6%, transparent 64.6% 92%, rgba(95, 243, 255, 0.25) 92% 94%, transparent 94%);
    -webkit-mask-image: linear-gradient(transparent, #000 40%); mask-image: linear-gradient(transparent, #000 40%);
    animation: hum 4s ease-in-out infinite; }
@keyframes hum { 50% { opacity: 0.75; } }
.horizon { position: absolute; left: 0; right: 0; top: var(--hz); height: 1px; background: var(--cy); box-shadow: 0 0 8px var(--cy), 0 0 20px rgba(95, 243, 255, 0.5); }
/* A synthwave sun sinking into the grid: bands cut out of its lower half, thicker toward the horizon. */
.sun { position: absolute; left: var(--vx); top: var(--hz); width: 120px; height: 60px; margin: -60px 0 0 -60px; border-radius: 120px 120px 0 0;
    background: linear-gradient(#ffe08a, #ff9a5a 40%, var(--pk) 85%);
    -webkit-mask-image: linear-gradient(#000 0 52%, transparent 52% 56%, #000 56% 66%, transparent 66% 72%, #000 72% 80%, transparent 80% 88%, #000 88% 93%, transparent 93%);
    mask-image: linear-gradient(#000 0 52%, transparent 52% 56%, #000 56% 66%, transparent 66% 72%, #000 72% 80%, transparent 80% 88%, #000 88% 93%, transparent 93%);
    filter: drop-shadow(0 0 10px rgba(255, 61, 154, 0.6)); animation: sink 14s ease-in-out infinite alternate; }
@keyframes sink { to { transform: translateY(6px); } }
.sun-glow { position: absolute; left: var(--vx); top: var(--hz); width: 260px; height: 110px; margin: -80px 0 0 -130px;
    background: radial-gradient(ellipse at 50% 72%, rgba(255, 61, 154, 0.35), rgba(255, 120, 80, 0.12) 40%, transparent 70%); }

/* ---- Panel ---- */
.panel { position: absolute; left: 4%; top: 50%; width: 200px; margin-top: -76px; padding: 8px 10px 9px;
    background: linear-gradient(160deg, rgba(20, 50, 80, 0.55), rgba(8, 16, 34, 0.75));
    -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px);
    clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px); }
.panel::before { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(var(--cy), var(--cy)) top / 100% 1px no-repeat,
        linear-gradient(var(--cy), var(--cy)) left / 1px 100% no-repeat,
        linear-gradient(var(--cy-lo), var(--cy-lo)) bottom / 100% 1px no-repeat,
        linear-gradient(var(--cy-lo), var(--cy-lo)) right / 1px 100% no-repeat,
        repeating-linear-gradient(transparent 0 2px, rgba(95, 243, 255, 0.05) 2px 3px); }
.panel h1 { margin: 0; font-family: oriel:smiley; font-size: 15px; font-weight: normal; line-height: 16px;
    letter-spacing: 1px; color: #fff; text-shadow: -1px 0 rgba(255, 61, 154, 0.8), 1px 0 rgba(95, 243, 255, 0.8); animation: glitch 5s steps(1) infinite; }
.panel .sub { margin-top: 1px; color: var(--cy); letter-spacing: 1px; }
@keyframes glitch { 0%, 92%, 96%, 100% { transform: none; opacity: 1; } 93% { transform: translateX(2px); opacity: 0.7; } 95% { transform: translateX(-1px); } }
.gauges { margin-top: 6px; display: flex; flex-direction: column; gap: 4px; }
.g { display: grid; grid-template-columns: 54px 1fr 26px; align-items: center; gap: 5px; }
.g .bar { height: 4px; background: rgba(95, 243, 255, 0.12); position: relative; }
.g .bar i { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(90deg, var(--cy-lo), var(--cy)); box-shadow: 0 0 5px var(--cy); }
.g .bar::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0 5px, var(--bg) 5px 6px); }
.g b { font-weight: normal; text-align: right; color: var(--cy); }
.g.alert .bar i { background: linear-gradient(90deg, rgba(255, 61, 154, 0.3), var(--pk)); box-shadow: 0 0 5px var(--pk); animation: alert 0.9s steps(2) infinite; }
.g.alert b, .g.alert span { color: var(--pk); }
@keyframes alert { 50% { opacity: 0.45; } }
.term { margin-top: 7px; padding-top: 5px; border-top: 1px dashed rgba(95, 243, 255, 0.3); color: var(--dim); }
.line { height: 9px; white-space: nowrap; overflow: hidden; width: 0; animation: type 9s steps(36) infinite; }
.line:nth-child(2) { animation-delay: 1s; } .line:nth-child(3) { animation-delay: 2s; } .line:nth-child(4) { animation-delay: 3s; color: var(--tx); }
@keyframes type { 0% { width: 0; } 10% { width: 100%; } 100% { width: 100%; } }
.cursor { display: inline-block; width: 5px; height: 7px; margin-left: 1px; background: var(--cy); vertical-align: -1px; animation: blink 0.9s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.badge { position: absolute; right: 10px; top: 9px; width: 16px; height: 14px; display: flex; align-items: center; justify-content: center;
    color: #12001b; background: var(--pk); clip-path: polygon(25% 0, 75% 0, 100% 50%, 75% 100%, 25% 100%, 0 50%);
    animation: alert 1.2s steps(2) infinite; }

/* ---- Energy ring ---- */
.energy { position: absolute; right: 5%; top: var(--hz); width: 92px; height: 92px; margin-top: -40px; }
.energy .seg { position: absolute; inset: 0; border-radius: 50%;
    background: repeating-conic-gradient(from 225deg, rgba(95, 243, 255, 0.18) 0deg 7deg, transparent 7deg 10deg);
    -webkit-mask-image: radial-gradient(circle, transparent 34px, #000 35px, #000 44px, transparent 45px);
    mask-image: radial-gradient(circle, transparent 34px, #000 35px, #000 44px, transparent 45px); }
.energy .fill { background: repeating-conic-gradient(from 225deg, var(--cy) 0deg 7deg, transparent 7deg 10deg);
    -webkit-mask-image: radial-gradient(circle, transparent 34px, #000 35px, #000 44px, transparent 45px),
        conic-gradient(from 225deg, #000 0deg 197deg, transparent 197deg);
    mask-image: radial-gradient(circle, transparent 34px, #000 35px, #000 44px, transparent 45px),
        conic-gradient(from 225deg, #000 0deg 197deg, transparent 197deg);
    -webkit-mask-composite: source-in; mask-composite: intersect; filter: drop-shadow(0 0 3px var(--cy)); }
.energy .inner { position: absolute; inset: 18px; border-radius: 50%; border: 1px solid rgba(95, 243, 255, 0.35);
    background: radial-gradient(circle, rgba(95, 243, 255, 0.15), transparent 70%); animation: spin 12s linear infinite; }
.energy .inner::before { content: ""; position: absolute; left: 50%; top: -3px; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: var(--cy); box-shadow: 0 0 4px var(--cy); }
@keyframes spin { to { transform: rotate(360deg); } }
.energy .v { position: absolute; left: 0; right: 0; top: 33px; text-align: center; font-family: oriel:smiley; font-size: 20px; color: #fff; text-shadow: 0 0 6px var(--cy); }
.energy .l { position: absolute; left: 0; right: 0; top: 56px; text-align: center; color: var(--cy); letter-spacing: 1px; }

/* ---- Corners and ticker ---- */
.corner { position: absolute; color: var(--dim); line-height: 9px; }
.corner b { font-weight: normal; color: var(--cy); }
.corner.tl { right: 8px; top: 6px; text-align: right; }
.corner.br { right: 8px; bottom: 18px; text-align: right; }
.ticker { position: absolute; left: 0; right: 0; bottom: 0; height: 12px; overflow: hidden; background: rgba(5, 10, 24, 0.85);
    border-top: 1px solid var(--cy-lo); }
.ticker div { position: absolute; left: 100%; top: 2px; white-space: nowrap; color: var(--dim); animation: tick 26s linear infinite; }
.ticker b { font-weight: normal; color: var(--pk); }
@keyframes tick { to { transform: translateX(-1400px); } }

@media (max-width: 480px) {
    .panel { left: 8px; width: 182px; }
    .energy { right: 8px; }
    .sun { width: 96px; height: 48px; margin: -48px 0 0 -48px; }
}
</style>
</head>
<body>
<div class="bridge">
  <i class="stars"></i><i class="sun-glow"></i><i class="sun"></i><i class="floor"></i><i class="horizon"></i>
  <div class="sc-back" data-go="styles" tabindex="0"><img src="../../textures/icons/back.png">风格示例<kbd>Esc</kbd></div>

  <div class="corner tl">SECTOR <b>7G-ARCADIA</b><br>ORBIT <b>342.7 KM</b><br>T+ <b>04:51:22</b></div>
  <div class="corner br">HULL <b>INTEGRITY 96%</b><br>CREW <b>5 / 6 ONLINE</b></div>

  <div class="panel">
    <h1>SYS // ONLINE</h1>
    <div class="sub">舰桥终端 · v3.1</div>
    <span class="badge">!</span>
    <div class="gauges">
      <div class="g"><span>反应堆温度</span><span class="bar"><i style="width: 62%"></i></span><b>62°</b></div>
      <div class="g"><span>护盾强度</span><span class="bar"><i style="width: 88%"></i></span><b>88%</b></div>
      <div class="g alert"><span>上行链路</span><span class="bar"><i style="width: 34%"></i></span><b>34%</b></div>
      <div class="g"><span>维生系统</span><span class="bar"><i style="width: 100%"></i></span><b>OK</b></div>
    </div>
    <div class="term">
      <div class="line">&gt; 握手完成 · 信道 0x3F 已加密</div>
      <div class="line">&gt; 正在解密中继信号……</div>
      <div class="line">&gt; 节点 7 应答：坐标已锁定</div>
      <div class="line">&gt; 等待舰长指令<i class="cursor"></i></div>
    </div>
  </div>

  <div class="energy">
    <i class="seg"></i><i class="seg fill"></i><i class="inner"></i>
    <span class="v">73</span><span class="l">ENERGY</span>
  </div>

  <div class="ticker"><div>舰队广播 · 跃迁窗口将在 <b>00:42</b> 后开启 · 第七区检测到未知信号 · 护盾谐振已校准 · 补给舰 KESTREL 已对接 · 请所有船员返回岗位 ·</div></div>
</div>
</body>
</html>
