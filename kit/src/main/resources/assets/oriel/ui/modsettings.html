<!doctype html>
<html>
<head>
<title data-i18n="oriel.ui.modsettings.window_title">oriel.ui.modsettings.window_title</title>
<link rel="stylesheet" href="ore.css">
<style>
/* The mod's own settings: a few honest switches grouped by what they change. The page shows what the game reports and
   writes each change back at once (ModSettingsPreset); nothing here is for debugging. */
.page { flex: 1; min-width: 0; min-height: 0; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 8px; }

.top { flex: none; display: flex; align-items: center; gap: 8px; min-height: 18px; }
.top .t { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.top .t b { font-weight: normal; color: var(--o-text); }
.top .t span { color: var(--o-text-faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top .saved { color: #b6f08f; opacity: 0; transition: opacity 240ms; white-space: nowrap; }
.top .saved.on { opacity: 1; }
.top .ore-btn { flex: none; min-height: 18px; padding: 0 8px; white-space: nowrap; }

#groups { display: flex; flex-direction: column; gap: 8px; }
.group { min-width: 0; padding: 6px 10px 4px; display: flex; flex-direction: column; animation: m-pop var(--m-slow) var(--m-spring) both; }
.group:nth-of-type(2) { animation-delay: 70ms; }
.group:nth-of-type(3) { animation-delay: 140ms; }
.group h3 { margin: 0 0 2px; display: flex; align-items: center; gap: 5px; font-weight: normal; color: var(--o-text-dim); letter-spacing: 1px; }
.group h3 .o-ico { -mc-tint: var(--o-accent-strong); }

.item { display: flex; align-items: center; gap: 10px; min-height: 26px; padding: 4px 0; border-top: 1px solid var(--o-line); }
.item:first-of-type { border-top: 0; }
.item .label { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 1px; }
.item .label .n { display: flex; align-items: center; gap: 5px; color: var(--o-text); }
.item .label .n em { font-style: normal; padding: 0 3px; color: var(--o-text-faint); border: 1px solid var(--o-line); white-space: nowrap; }
.item .label .h { color: var(--o-text-faint); line-height: 10px; }
.item .control { flex: none; width: 46%; max-width: 190px; display: flex; align-items: center; justify-content: flex-end; gap: 6px; }
.item .control .ore-slider { flex: 1; min-width: 40px; }
.item .control .val { flex: none; min-width: 26px; text-align: right; color: var(--o-text-dim); }
.item .control .o-seg { flex: none; }
.item.off .label .n { color: var(--o-text-dim); }

@media (max-width: 500px) {
    .item { flex-wrap: wrap; row-gap: 3px; }
    .item .control { width: 100%; max-width: none; justify-content: flex-start; }
    .o-hints, .o-apptabs em { display: none; }
}
</style>
</head>
<body>
<div class="o-app">
<div class="o-window" id="modsettings">
  <div class="o-titlebar">
    <div class="o-brand"><img src="../textures/ui/emblem.png"><b data-i18n="oriel.ui.brand.name">oriel.ui.brand.name</b><span data-i18n="oriel.ui.brand.sub">oriel.ui.brand.sub</span></div>
    <div class="o-grow"></div>
    <div class="ore-btn icon" data-action="theme" tabindex="0" title="oriel.ui.gallery.toggle_light_dark" data-i18n-title="oriel.ui.gallery.toggle_light_dark"><img class="o-ico" src="../textures/icons/sun.png"></div>
    <div class="ore-btn icon" data-action="close" tabindex="0"><img class="o-ico" src="../textures/icons/close.png"></div>
  </div>
  <div class="o-tabbar">
    <div class="o-apptabs" id="nav">
      <div data-go="gallery"><img class="o-ico" src="../textures/icons/home.png"><em data-i18n-text-0="oriel.ui.nav.home">oriel.ui.nav.home</em></div>
      <div data-go="styles"><img class="o-ico" src="../textures/icons/users.png"><em data-i18n-text-0="oriel.ui.nav.community">oriel.ui.nav.community</em></div>
      <div data-go="catalog"><img class="o-ico" src="../textures/icons/grid.png"><em data-i18n-text-0="oriel.ui.nav.components">oriel.ui.nav.components</em></div>
      <div data-go="icons"><img class="o-ico" src="../textures/icons/star.png"><em data-i18n-text-0="oriel.ui.nav.icons">oriel.ui.nav.icons</em></div>
      <div class="on" data-go="modsettings"><img class="o-ico" src="../textures/icons/gear.png"><em data-i18n-text-0="oriel.ui.nav.settings">oriel.ui.nav.settings</em></div>
      <div data-go="about"><img class="o-ico" src="../textures/icons/help.png"><em data-i18n-text-0="oriel.ui.nav.about">oriel.ui.nav.about</em></div>
      <i class="m-indicator" id="indicator"></i>
    </div>
  </div>
  <div class="o-body">
    <div class="page">
      <div class="top">
        <div class="t"><b data-i18n="oriel.ui.modsettings.title">oriel.ui.modsettings.title</b><span data-i18n="oriel.ui.modsettings.sub">oriel.ui.modsettings.sub</span></div>
        <span class="saved" id="saved" data-i18n="oriel.ui.modsettings.saved">oriel.ui.modsettings.saved</span>
        <div class="ore-btn" id="reset" tabindex="0" data-i18n="oriel.ui.modsettings.reset">oriel.ui.modsettings.reset</div>
      </div>
      <div id="groups"></div>
    </div>
  </div>
</div>
</div>
</body>
</html>
