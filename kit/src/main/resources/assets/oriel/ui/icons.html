<!doctype html>
<html>
<head>
<title>优易库 · 图标</title>
<link rel="stylesheet" href="ore.css">
<style>
/* The icon library: 200 pixel icons (16×16 white glyphs with a baked shadow, tinted in CSS with -mc-tint). Categories
   on the left, the icons in a grid that fills its width (loading a batch per frame), the chosen one on the right at
   three sizes and in the theme's colours, with the markup to copy. IconsPreset reads icons.json. */
.cats { flex: none; width: 124px; display: flex; flex-direction: column; gap: 1px; padding: 5px 4px; overflow-y: auto; background: var(--o-well);
    border-right: 1px solid var(--o-line-strong); box-shadow: inset -1px 0 0 var(--o-line); }
.cats .cat { position: relative; display: flex; align-items: center; gap: 5px; height: 20px; padding: 0 5px; cursor: pointer; color: var(--o-text-dim);
    -mc-tint: var(--o-text-faint); }
.cats .cat.on { -mc-tint: var(--o-accent-strong); }
.cats .cat:hover { background: var(--o-line); color: var(--o-text); }
.cats .cat.on { background: var(--o-tile); color: var(--o-text); box-shadow: inset 0 1px 0 var(--o-tile-hi), 0 1px 0 var(--o-shade); }
.cats .cat.on::before { content: ""; position: absolute; left: -4px; top: 3px; width: 2px; height: 12px; background: var(--o-accent-strong); }
.cats .cat .n { margin-left: auto; color: var(--o-text-faint); }

.main { position: relative; flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px; padding: 6px; }
.bar { flex: none; display: flex; align-items: center; gap: 6px; }
.bar .search { position: relative; flex: 1; display: flex; }
.bar .search input { flex: 1; width: 10px; padding-left: 18px; height: 16px; }
.bar .search .o-ico { position: absolute; left: 2px; top: 0; -mc-tint: var(--o-text-faint); pointer-events: none; }
.bar .count { color: var(--o-text-faint); white-space: nowrap; }
.grid { flex: 1; min-height: 0; overflow-y: auto; align-content: start; padding-right: 2px; }
.tile { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; height: 44px; padding: 0 2px; cursor: pointer;
    background: var(--o-well); border: 1px solid transparent; color: var(--o-text-dim); -mc-tint: var(--o-text); transition: background-color 120ms; }
.tile:hover { background: var(--o-line); color: var(--o-text); -mc-tint: var(--o-accent-strong); }
.tile.on { border-color: var(--o-accent-strong); background: color-mix(in srgb, var(--o-accent) 16%, transparent); color: var(--o-text); }
.tile .nm { width: 100%; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.empty { color: var(--o-text-faint); padding: 12px 4px; }

/* The chosen icon. */
.detail { flex: none; width: 156px; display: flex; flex-direction: column; gap: 5px; padding: 6px; overflow-y: auto; background: var(--o-well);
    border-left: 1px solid var(--o-line-strong); box-shadow: inset 1px 0 0 var(--o-line); }
.stage { position: relative; height: 92px; flex: none; display: flex; align-items: center; justify-content: center; gap: 10px;
    -mc-tint: var(--tint, var(--o-text)); }
.stage .big { width: 64px; height: 64px; image-rendering: pixelated; }
.stage .mid { width: 32px; height: 32px; image-rendering: pixelated; }
.stage .small { width: 16px; height: 16px; }
.d-name { color: var(--o-text); }
.d-id { color: var(--o-text-faint); }
.d-tags { display: flex; flex-wrap: wrap; gap: 2px; }
.d-tags .o-chip { height: 11px; padding: 0 3px; }
.tints { display: flex; gap: 2px; }
.tints span { width: 14px; height: 14px; cursor: pointer; background: var(--c); border: 1px solid rgba(0, 0, 0, 0.6); }
.tints span.on { box-shadow: 0 0 0 1px var(--o-text); }
.code { margin: 0; padding: 4px 5px; background: rgba(0, 0, 0, 0.45); border: 1px solid var(--o-line-strong); color: #b6f08f; line-height: 10px; white-space: normal; word-break: break-all; }
[data-theme=light] .code { background: #2b2b2b; }
.foot { flex: none; display: flex; align-items: center; gap: 8px; padding: 3px 6px; border-top: 1px solid var(--o-line-strong); box-shadow: inset 0 1px 0 var(--o-line); color: var(--o-text-faint); }

@media (max-width: 560px) {
    .detail { display: none; }
    .cats { width: 92px; }
}
</style>
</head>
<body>
<div class="o-app" id="app">
  <div class="o-window">
    <div class="o-titlebar">
      <div class="o-brand"><img src="../textures/ui/emblem.png"><b>优易库</b><span>Oriel UI</span></div>
      <span class="o-crumb" id="crumb">/ 全部图标</span>
      <div class="o-grow"></div>
      <div class="o-seg" title="图标粗细"><span data-icons-pick="bold">粗体</span><span data-icons-pick="thin">细体</span></div>
      <div class="o-seg"><span data-style-pick="ore">像素</span><span data-style-pick="smooth">平滑</span></div>
      <div class="ore-btn icon" data-action="theme" tabindex="0" title="切换亮/暗"><img class="o-ico" src="../textures/icons/sun.png"></div>
      <div class="ore-btn icon" data-action="close" tabindex="0"><img class="o-ico" src="../textures/icons/close.png"></div>
    </div>
    <div class="o-tabbar">
      <div class="o-apptabs">
        <div data-go="gallery"><img class="o-ico" src="../textures/icons/home.png"><em>首页</em></div>
        <div data-go="catalog"><img class="o-ico" src="../textures/icons/grid.png"><em>组件与动效</em></div>
        <div class="on" data-go="icons"><img class="o-ico" src="../textures/icons/star.png"><em>图标</em></div>
        <div data-go="editor"><img class="o-ico" src="../textures/icons/layers.png"><em>编辑器</em></div>
        <i class="m-indicator"></i>
      </div>
    </div>
    <div class="o-body">
      <div class="cats" id="cats"></div>
      <div class="main">
        <div class="bar">
          <div class="search"><input class="ore-field" id="q" placeholder="搜索名称、拼写或标签"><img class="o-ico" src="../textures/icons/search.png"></div>
          <span class="count" id="count"></span>
        </div>
        <div class="grid o-auto" id="grid" style="--min: 52px; --gap: 3px"></div>
      </div>
      <div class="detail" id="detail">
        <div class="stage o-well deco-host" id="stage"><i class="deco grid"></i><i class="deco glow" style="--deco-y: 50%"></i>
          <img class="big" id="d-big"><img class="mid" id="d-mid"><img class="small" id="d-small"></div>
        <span class="d-name" id="d-name"></span>
        <span class="d-id" id="d-id"></span>
        <div class="d-tags" id="d-tags"></div>
        <span class="o-caps">着色</span>
        <div class="tints" id="tints"></div>
        <span class="o-caps">写法</span>
        <pre class="code" id="d-code"></pre>
      </div>
    </div>
    <div class="foot"><span id="total"></span><div class="o-grow"></div><div class="o-hints"><span><span class="o-kbd">←</span><span class="o-kbd">→</span>选择</span></div></div>
  </div>
</div>
</body>
</html>
