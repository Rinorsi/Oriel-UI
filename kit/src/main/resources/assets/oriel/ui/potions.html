<!doctype html>
<html>
<head>
<title>药水 HUD</title>
<link rel="stylesheet" href="ore.css">
<style>
.hud { position: absolute; top: 4px; right: 4px; width: 124px; display: flex; flex-direction: column; gap: 3px; }
.group { display: flex; flex-direction: column; gap: 1px; transition: opacity var(--ore-slow); }
.group.empty { opacity: 0; }
.head {
    display: flex; align-items: center; gap: 3px; height: 11px; padding: 0 3px;
    color: var(--ore-text); cursor: pointer; background: rgba(15, 15, 16, 0.62);
}
.head .caret { transition: transform var(--ore-medium) var(--ore-ease); }
.group.folded .head .caret { transform: rotate(-90deg); }
.head .n { margin-left: auto; color: var(--ore-text-dim); }
.list { display: flex; flex-direction: column; gap: 1px; }
.strip { display: none; flex-wrap: wrap; gap: 1px; padding: 2px; background: rgba(15, 15, 16, 0.7); }
.group.folded .list, .group.folded .more { display: none; }
.group.folded .strip { display: flex; animation: ore-rise 0.2s var(--ore-ease); }
.strip img { width: 12px; height: 12px; }
.fx {
    position: relative; height: 18px; display: flex; align-items: center; gap: 4px; padding: 0 4px 0 4px;
    background: rgba(30, 30, 31, 0.84); border: 1px solid rgba(0, 0, 0, 0.85);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
    animation: slide-in 0.42s var(--ore-ease) backwards;
    transition: opacity 0.6s ease-out, transform 0.6s ease-in;
}
.fx::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: var(--ore-green-3); }
.fx.harmful::before { background: var(--ore-red-light); }
.fx.neutral::before { background: #6e9cf2; }
.fx img { width: 16px; height: 16px; flex-shrink: 0; }
.fx .name { flex-grow: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fx.harmful .name { color: #ff9a9a; }
.fx .time { color: var(--ore-text-dim); }
.fx.low .time { color: var(--ore-red-light); animation: blink 0.8s steps(2) infinite; }
.fx .bar { position: absolute; left: 2px; right: 0; bottom: 0; height: 1px; background: rgba(255, 255, 255, 0.08); }
.fx .bar .left { height: 1px; background: var(--ore-green-3); }
.fx.harmful .bar .left { background: var(--ore-red-light); }
.fx.neutral .bar .left { background: #6e9cf2; }
.fx.fresh { outline: 1px solid var(--ore-gold); }
.fx.gone { opacity: 0; transform: translateX(16px); }
@keyframes slide-in { from { opacity: 0; transform: translateX(132px); } to { opacity: 1; transform: none; } }
@keyframes blink { from { opacity: 1; } to { opacity: 0.35; } }
.more {
    height: 12px; display: flex; align-items: center; justify-content: center;
    background: rgba(30, 30, 31, 0.7); border: 1px solid rgba(0, 0, 0, 0.8); color: var(--ore-text-dim); cursor: pointer;
}
.more:hover, .head:hover { color: var(--ore-text); }
.toast { position: absolute; top: 4px; left: 50%; margin-left: -70px; width: 140px; padding: 3px 6px; text-align: center;
    border: 2px solid transparent; border-image: url(../textures/ore/tooltip.png) 2 fill; opacity: 0;
    transition: opacity var(--ore-slow); }
.toast.on { opacity: 1; }
</style>
</head>
<body>
<div class="hud" id="hud"></div>
<div class="toast" id="toast"></div>
</body>
</html>
