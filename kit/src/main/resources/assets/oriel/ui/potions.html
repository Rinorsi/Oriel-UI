<!doctype html>
<html>
<head>
<title data-i18n="oriel.ui.potions.window_title">oriel.ui.potions.window_title</title>
<link rel="stylesheet" href="ore.css">
<style>
/* Drawn over the world. The bar is the always-on form: up to five 22px tiles, each its own small glass square with
   its dark drain growing from the top as time runs out (like an item cooldown), the level on the corner outside the
   icon and the time under the square; more effects fold into "+N". A new effect's card slides out under the bar and folds back into its tile. The handle opens the full
   panel (shared with the inventory: .o-effects in ore.css). */
html, body { background: none; }
.hud { position: absolute; top: 4px; right: 4px; display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }

.hud-bar { display: flex; align-items: flex-start; gap: 3px; }
.tiles { display: flex; gap: 3px; }
.tile { --kind: #6cc349; position: relative; width: 22px; height: 33px; display: flex; flex-direction: column; align-items: center;
    animation: tile-in 360ms var(--o-ease-back) backwards; transition: opacity 600ms, transform 600ms; }
.tile.harmful { --kind: #e25a5a; }
.tile.neutral { --kind: #ffb52b; }
.tile::before { content: ""; position: absolute; left: 0; top: 0; width: 22px; height: 22px; background: rgba(12, 12, 16, 0.62);
    border: 1px solid rgba(255, 255, 255, 0.10); box-shadow: inset 0 -2px 0 var(--kind), 0 1px 3px rgba(0, 0, 0, 0.5); }
.tile img { position: relative; margin-top: 3px; width: 16px; height: 16px; }
.tile .drain { position: absolute; left: 1px; top: 1px; width: 20px; height: 0; background: rgba(0, 0, 0, 0.55); pointer-events: none; }
.tile .lv { position: absolute; right: -3px; top: -3px; min-width: 7px; padding: 0 1px; text-align: center; color: #ffffff; font-weight: normal;
    background: rgba(12, 12, 16, 0.85); border: 1px solid rgba(255, 255, 255, 0.16); line-height: 8px; }
.tile .lv { display: none; }
.tile.leveled .lv { display: block; }
.tile .t { margin-top: 6px; color: #e6e7e9; text-shadow: 1px 1px 0 #000000; white-space: nowrap; }
.tile.low .t { color: #ff8a8a; animation: eff-blink 0.8s steps(2) infinite; }
.tile.low::before { border-color: rgba(226, 90, 90, 0.8); }
.tile.fresh::before { border-color: #ffd36b; box-shadow: 0 0 6px rgba(255, 200, 80, 0.9); }
.tile.gone { opacity: 0; transform: translateY(-6px) scale(0.8); }
@keyframes tile-in { from { opacity: 0; transform: scale(0.4); } }
.more-tiles { height: 22px; display: flex; align-items: center; padding: 0 4px; color: #e6e7e9; text-shadow: 1px 1px 0 #000000;
    background: rgba(12, 12, 16, 0.62); border: 1px solid rgba(255, 255, 255, 0.10); }
.more-tiles.none { display: none; }
.handle { width: 14px; height: 22px; display: flex; align-items: center; justify-content: center; cursor: pointer;
    -mc-tint: #8c8d90; transition: -mc-tint 120ms; }
.handle:hover { -mc-tint: #ffffff; }
.handle img { transition: transform 200ms var(--o-ease-out); }
.hud.full .handle img { transform: rotate(180deg); }

/* The announcement card. */
.toast { --kind: #6cc349; display: flex; align-items: center; gap: 6px; padding: 4px 8px 4px 5px; min-width: 120px; overflow: hidden;
    border: 2px solid transparent; border-image: url(../textures/ore/panel_glass.png) 2 fill;
    box-shadow: inset 2px 0 0 var(--kind); opacity: 0; height: 0; padding-top: 0; padding-bottom: 0;
    transition: opacity 220ms, height 260ms var(--o-ease-out), padding 260ms var(--o-ease-out), transform 260ms var(--o-ease-out); transform: translateY(-8px); }
.toast.harmful { --kind: #e25a5a; }
.toast.neutral { --kind: #ffb52b; }
.toast.on { opacity: 1; height: 26px; padding-top: 4px; padding-bottom: 4px; transform: none; }
.toast img { width: 16px; height: 16px; flex: none; }
.toast .name { color: #ffffff; }
.toast .sub { color: #a9abb0; }

/* The full panel, on glass. */
.panel { width: 150px; display: none; padding: 4px; border: 2px solid transparent; border-image: url(../textures/ore/panel_glass.png) 2 fill;
    --o-tile: rgba(30, 30, 31, 0.8); --o-tile-edge: rgba(0, 0, 0, 0.85); --o-text: #ffffff; --o-text-dim: #c4c5c8; --o-text-faint: #8c8d90; }
.hud.full .panel { display: flex; animation: fx-rise 220ms var(--o-ease-out); }
.hint { color: #8c8d90; text-shadow: 1px 1px 0 #000000; animation: hint-out 7s ease-in forwards; }
@keyframes hint-out { 0%, 80% { opacity: 1; } 100% { opacity: 0; } }
.hud.full .hint { display: none; }
/* In game, before the player has any effect: only the hint, saying so. */
.hud.empty .hud-bar, .hud.empty .toast, .hud.empty .panel { display: none; }
</style>
</head>
<body>
<div class="hud" id="hud">
  <div class="hud-bar">
    <div class="tiles" id="tiles"></div>
    <span class="more-tiles none" id="more-tiles"></span>
    <div class="handle" id="handle" tabindex="0" title="oriel.ui.potions.handle" data-i18n-title="oriel.ui.potions.handle"><img class="o-ico" src="../textures/icons/down.png"></div>
  </div>
  <div class="toast" id="toast"></div>
  <div class="panel o-effects" id="panel"></div>
  <div class="hint" data-i18n="oriel.ui.potions.hint">oriel.ui.potions.hint</div>
</div>
</body>
</html>
