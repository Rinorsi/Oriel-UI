<!doctype html>
<html>
<head>
<title>优易库 · 锻造台</title>
<link rel="stylesheet" href="ore.css">
<style>
/* One stage lit by the forge: the anvil in 3D with the glowing ingot on it, the hammer swinging in, embers rising as
   the furnace heats (their rate follows the temperature), sparks on every strike and a heat haze over hot metal.
   The furnace column is on the left, the rhythm bar along the floor; the side pane keeps score. */
.o-main { padding: 0; gap: 0; }
.stage {
    position: relative; flex: 1; min-height: 0; overflow: hidden;
    background: radial-gradient(ellipse at 50% 92%, rgba(255, 120, 30, 0.34), rgba(255, 90, 20, 0) 58%),
        linear-gradient(#141012, #221714 62%, #2a1d18 62%, #1a1210);
}
.stage::after { content: ""; position: absolute; left: 0; right: 0; top: 62%; height: 1px; background: rgba(255, 170, 90, 0.18); pointer-events: none; }
[data-theme=light] .stage { background: radial-gradient(ellipse at 50% 92%, rgba(255, 140, 50, 0.40), rgba(255, 90, 20, 0) 58%), linear-gradient(#5b4a42, #6e5a4f 62%, #7a6253 62%, #5f4b40); }
.glow { position: absolute; left: 50%; top: 40%; width: 260px; height: 180px; margin-left: -130px; margin-top: -60px; pointer-events: none;
    background: radial-gradient(ellipse, rgba(255, 150, 50, 0.45), rgba(255, 100, 20, 0) 65%); }

/* The anvil block, with the ingot riding on its face. */
.anvil-wrap { position: absolute; left: 50%; bottom: 46px; width: 150px; height: 130px; margin-left: -75px; }
.anvil-wrap model { position: absolute; left: 0; bottom: 0; width: 150px; height: 130px; -mc-yaw: 90deg; -mc-pitch: 18deg; }
.ingot { position: absolute; top: 34px; height: 7px; left: 60px; width: 30px; border: 1px solid rgba(0, 0, 0, 0.55);
    box-shadow: 0 0 6px rgba(255, 140, 40, 0.6); transition: width 200ms var(--o-ease-back), left 200ms var(--o-ease-back); }
.ingot::after { content: ""; position: absolute; left: 1px; right: 1px; top: 0; height: 2px; background: rgba(255, 255, 255, 0.35); }
.haze { position: absolute; left: 30px; right: 30px; top: -36px; height: 60px; pointer-events: none; opacity: 0.5;
    background: repeating-linear-gradient(rgba(255, 220, 160, 0) 0 3px, rgba(255, 220, 160, 0.10) 4px, rgba(255, 220, 160, 0) 6px 9px);
    animation: haze 1.6s linear infinite; }
@keyframes haze { from { transform: translateY(0) skewX(0deg); } 50% { transform: translateY(-4px) skewX(3deg); } to { transform: translateY(-9px) skewX(0deg); } }
.hammer { position: absolute; left: 92px; top: -44px; width: 48px; height: 48px; transform-origin: 40px 40px; transform: rotate(28deg); }
.hammer.swing-a { animation: swing-a 300ms var(--o-ease-out); }
.hammer.swing-b { animation: swing-b 300ms var(--o-ease-out); }
@keyframes swing-a { 0% { transform: rotate(28deg); } 35% { transform: rotate(-38deg); } 50% { transform: rotate(-30deg); } 100% { transform: rotate(28deg); } }
@keyframes swing-b { 0% { transform: rotate(28deg); } 35% { transform: rotate(-38deg); } 50% { transform: rotate(-30deg); } 100% { transform: rotate(28deg); } }
.stage.shake-a { animation: shake-a 220ms linear; }
.stage.shake-b { animation: shake-b 220ms linear; }
@keyframes shake-a { 25% { transform: translate(-3px, 1px); } 50% { transform: translate(3px, -1px); } 75% { transform: translate(-1px, 1px); } }
@keyframes shake-b { 25% { transform: translate(3px, 1px); } 50% { transform: translate(-3px, -1px); } 75% { transform: translate(1px, 1px); } }
.flash { position: absolute; left: 0; top: 0; right: 0; bottom: 0; pointer-events: none; opacity: 0;
    background: radial-gradient(circle at 50% 52%, rgba(255, 245, 200, 0.75), rgba(255, 200, 80, 0) 45%); }
.flash.on-a { animation: flash-a 260ms ease-out; }
.flash.on-b { animation: flash-b 260ms ease-out; }
@keyframes flash-a { from { opacity: 1; } to { opacity: 0; } }
@keyframes flash-b { from { opacity: 1; } to { opacity: 0; } }
.verdict { position: absolute; left: 0; right: 0; top: 26px; text-align: center; font-size: 16px; line-height: 18px; text-shadow: 1px 1px 0 #000000, 0 0 6px rgba(0, 0, 0, 0.6); opacity: 0; }
.verdict.pop-a { animation: pop-a 900ms var(--o-ease-out); }
.verdict.pop-b { animation: pop-b 900ms var(--o-ease-out); }
@keyframes pop-a { 0% { opacity: 0; transform: scale(0.6); } 15% { opacity: 1; transform: scale(1.15); } 30% { transform: scale(1); } 75% { opacity: 1; } 100% { opacity: 0; transform: translateY(-8px); } }
@keyframes pop-b { 0% { opacity: 0; transform: scale(0.6); } 15% { opacity: 1; transform: scale(1.15); } 30% { transform: scale(1); } 75% { opacity: 1; } 100% { opacity: 0; transform: translateY(-8px); } }

/* The furnace column: segments lit from the bottom by the temperature, the working range marked in green. */
.furnace { position: absolute; left: 10px; top: 12px; bottom: 46px; width: 34px; display: flex; flex-direction: column; align-items: center; gap: 3px; }
.furnace .o-ico { -mc-tint: #ff8a3a; }
.gauge { position: relative; flex: 1; width: 14px; background: rgba(0, 0, 0, 0.5); border: 1px solid #0f0f10; box-shadow: 0 0 0 1px rgba(255, 170, 90, 0.18); }
.gauge .level { position: absolute; left: 0; right: 0; bottom: 0; background: linear-gradient(#fff6d6, #ffba46 25%, #e6701e 55%, #c42e16 80%, #6e1a12);
    box-shadow: 0 0 8px rgba(255, 140, 40, 0.55); }
.gauge .ticks { position: absolute; left: 0; right: 0; top: 0; bottom: 0; pointer-events: none;
    background: repeating-linear-gradient(rgba(0, 0, 0, 0) 0 5px, rgba(0, 0, 0, 0.55) 5px 6px); }
.gauge .ideal { position: absolute; left: -4px; right: -4px; border-top: 1px solid #86d562; border-bottom: 1px solid #86d562; background: rgba(108, 195, 73, 0.12); }
.temp { color: #ffd9a8; text-shadow: 1px 1px 0 #000000; }
.temp.cold { color: #8fd8ff; }
.temp.hot { color: #ff6a6a; animation: fx-pulse 0.6s ease-in-out infinite; }

/* The rhythm bar on the floor of the stage. */
.rhythm { position: absolute; left: 56px; right: 56px; bottom: 14px; height: 14px; }
.meter { position: absolute; left: 0; right: 0; top: 3px; height: 8px; background: rgba(0, 0, 0, 0.6); border: 1px solid #0f0f10; box-shadow: 0 0 0 1px rgba(255, 170, 90, 0.16); }
.zone { position: absolute; top: 0; bottom: 0; background: rgba(108, 195, 73, 0.55); box-shadow: 0 0 6px rgba(108, 195, 73, 0.6); transition: left 260ms var(--o-ease-out), width 260ms; }
.core { position: absolute; top: 0; bottom: 0; background: #ffd36b; box-shadow: 0 0 6px #ffb52b; transition: left 260ms var(--o-ease-out); }
.marker { position: absolute; top: -3px; width: 3px; height: 14px; margin-left: -1px; background: #ffffff; box-shadow: 0 0 4px #ffffff, 0 0 0 1px #000000; }
.rhythm .label { position: absolute; left: -44px; top: 2px; color: #ffd9a8; text-shadow: 1px 1px 0 #000000; }

/* Side pane. */
.o-side { width: 158px; }
.score { display: flex; align-items: flex-end; gap: 6px; }
.score .o-h1 { color: #ffd36b; }
.score .grade { margin-bottom: 2px; }
.o-meter.gold { --fill-hi: #fff0b0; --fill: #f8af2b; --fill-lo: #b8771a; }
.pips { display: grid; grid-template-columns: repeat(8, 1fr); gap: 2px; }
.pip { height: 16px; display: flex; align-items: center; justify-content: center; background: var(--o-well); border: 1px solid var(--o-line-strong); }
.pip::after { content: ""; width: 4px; height: 4px; background: var(--o-line); }
.pip.hit { background: rgba(108, 195, 73, 0.35); border-color: #6cc349; }
.pip.hit::after { background: #b6f08f; }
.pip.perfect { background: rgba(255, 181, 43, 0.4); border-color: #ffb52b; box-shadow: 0 0 5px rgba(255, 181, 43, 0.7); }
.pip.perfect::after { background: #fff3b0; }
.pip.miss { background: rgba(226, 90, 90, 0.3); border-color: #e25a5a; }
.pip.miss::after { background: #ff9a9a; }
.log { display: flex; flex-direction: column; gap: 2px; min-height: 0; }
.log > div { padding: 1px 3px; background: var(--o-well); }
.target { display: flex; align-items: center; gap: 6px; padding: 5px; }
.target item { width: 16px; height: 16px; }
.target .o-dim { line-height: 10px; }

.foot { flex: none; display: flex; align-items: center; gap: 6px; padding: 4px 6px; border-top: 1px solid var(--o-line-strong); box-shadow: inset 0 1px 0 var(--o-line); }
.foot .ore-btn { min-height: 20px; padding: 0 8px; }
.foot .ore-btn.hero { min-width: 70px; }
.ore-btn.bellows.on { border-image-source: url(../textures/ore/button_hero.png); }

/* The result. */
.result { position: absolute; left: 0; top: 0; right: 0; bottom: 0; z-index: 30; display: none; align-items: center; justify-content: center; background: rgba(0, 0, 0, 0.55); }
.result.on { display: flex; animation: fx-rise 260ms var(--o-ease-out); }
.result .card { position: relative; width: 200px; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 12px 12px; }
.result .card .stage3d { position: relative; width: 96px; height: 96px; }
.result .card .stage3d::before { content: ""; position: absolute; left: -30px; top: -30px; right: -30px; bottom: -30px; pointer-events: none;
    background: radial-gradient(circle, color-mix(in srgb, var(--tier) 45%, transparent), rgba(0, 0, 0, 0) 60%); }
.result .card model { width: 96px; height: 96px; animation: turn 5s linear infinite; }
@keyframes turn { from { -mc-yaw: 0deg; } to { -mc-yaw: 360deg; } }
.result .card .o-h1 { color: var(--tier); }
.result .card .ore-btn { margin-top: 4px; }
</style>
</head>
<body>
<div class="o-app">
  <div class="o-window">
    <div class="o-titlebar">
      <div class="ore-btn icon" id="back" tabindex="0"><img class="o-ico" src="../textures/icons/back.png"></div>
      <img class="o-mark" src="../textures/icons/anvil.png">
      <h1>锻造台</h1><span class="o-crumb">/ 铁剑</span>
      <div class="o-grow"></div>
      <div class="o-hints"><span><span class="o-kbd">空格</span>击打</span><span><span class="o-kbd">B</span>按住鼓风</span></div>
      <div class="ore-btn icon" id="close" tabindex="0"><img class="o-ico" src="../textures/icons/close.png"></div>
    </div>
    <div class="o-body">
      <div class="o-main">
        <div class="stage" id="stage">
          <div class="glow" id="glow"></div>
          <canvas class="fx" id="embers" data-fx="embers" data-rate="10" data-seed="3"></canvas>
          <div class="anvil-wrap">
            <model block="minecraft:anvil"></model>
            <div class="haze" id="haze"></div>
            <div class="ingot" id="ingot"></div>
            <item class="hammer" id="minecraft:mace"></item>
          </div>
          <canvas class="fx" id="sparks" data-seed="7"></canvas>
          <div class="flash" id="flash"></div>
          <div class="verdict" id="verdict"></div>
          <div class="furnace">
            <img class="o-ico" src="../textures/icons/flame.png">
            <div class="gauge" id="gauge"><div class="ideal" id="ideal"></div><div class="level" id="level"></div><div class="ticks"></div></div>
            <div class="temp" id="temp">900°</div>
          </div>
          <div class="rhythm">
            <span class="label">时机</span>
            <div class="meter" id="meter"><div class="zone" id="zone"></div><div class="core" id="core"></div><div class="marker" id="marker"></div></div>
          </div>
        </div>
      </div>
      <div class="o-side">
        <div class="o-caps">品质</div>
        <div class="score"><span class="o-h1" id="quality">0%</span><span class="o-chip grade r-common" id="grade">粗糙</span></div>
        <div class="o-meter gold" id="quality-bar" style="--value: 0"><i></i></div>
        <div class="o-caps">击打 <span id="strikes-left" class="o-faint">8</span></div>
        <div class="pips" id="pips"></div>
        <div class="log" id="log"></div>
        <div class="o-grow"></div>
        <div class="target o-tile">
          <item id="minecraft:iron_sword"></item>
          <div class="o-dim">目标 · 铁剑<br><span class="o-faint">炉温保持在绿区，踩准金色中心</span></div>
        </div>
      </div>
    </div>
    <div class="foot">
      <div class="ore-btn bellows" id="bellows" tabindex="0"><img class="o-ico" src="../textures/icons/flame.png">鼓风</div>
      <div class="ore-btn hero" id="strike" tabindex="0"><img class="o-ico" src="../textures/icons/hammer.png">击打</div>
      <div class="ore-btn secondary" id="quench" tabindex="0"><img class="o-ico" src="../textures/icons/flask.png">淬火</div>
      <div class="o-grow"></div>
      <span class="o-faint" id="tip">铁在 1050° – 1350° 最好锻打</span>
    </div>
    <div class="result" id="result">
      <div class="card o-tile o-frame r-rare" id="result-card">
        <canvas class="fx" id="result-fx" data-fx="stars" data-rate="8" data-seed="5"></canvas>
        <div class="stage3d"><model item="minecraft:iron_sword"></model></div>
        <div class="o-h1" id="result-title">精良 铁剑</div>
        <div class="o-dim" id="result-text">品质 78%</div>
        <div class="ore-btn primary" id="again" tabindex="0"><img class="o-ico" src="../textures/icons/refresh.png">再锻一把</div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
