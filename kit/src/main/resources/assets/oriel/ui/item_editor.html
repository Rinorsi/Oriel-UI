<!doctype html>
<html>
<head>
<title>优易库 · 物品编辑器</title>
<link rel="stylesheet" href="ore.css">
<style>
/* The item data editor (/oriel edit): the held item's data components on a working copy. The left column shows the
   item in 3D and the tooltip players will see, live; the tabs edit names and lore, enchantments, attribute
   modifiers and durability, and list every component as a tree. Saving sends the edit to the server, which checks
   it and writes only what changed. ItemEditorPreset drives it. */
.dirty { display: none; }
.dirty.on { display: inline-flex; }

.left { flex: none; width: 176px; display: flex; flex-direction: column; gap: 6px; padding: 6px; background: var(--o-well);
    border-right: 1px solid var(--o-line-strong); box-shadow: inset -1px 0 0 var(--o-line); }
.stage { position: relative; height: 92px; flex: none; display: flex; justify-content: center; overflow: hidden; }
.stage::before { content: ""; position: absolute; left: 10px; right: 10px; top: 0; bottom: 0; pointer-events: none;
    background: radial-gradient(circle, color-mix(in srgb, var(--tier) 40%, transparent), rgba(0, 0, 0, 0) 62%); }
.stage model { width: 92px; height: 92px; animation: turn 6s linear infinite; -mc-pitch: 12deg; }
@keyframes turn { from { -mc-yaw: 0deg; } to { -mc-yaw: 360deg; } }
.tooltip { position: relative; padding: 4px 6px 5px; border: 2px solid transparent; border-image: url(../textures/ore/tooltip.png) 2 fill;
    color: #ffffff; line-height: 10px; display: flex; flex-direction: column; gap: 1px; min-height: 0; overflow: hidden; }
.tooltip.glinted { border-image-source: url(../textures/ore/tooltip_rare.png); }
.tooltip .tn { color: var(--name, #ffffff); }
.tooltip .te { color: #a8a8a8; }
.tooltip .tl { color: #aa00aa; }
.tooltip .ta { color: #5555ff; }
.tooltip .tg { color: #a8a8a8; margin-top: 3px; }
.tooltip .td { color: #ffffff; }
.tooltip .tid { color: #555555; }

.main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; padding: 6px 8px; }
.tabs { flex: none; }
.panes { position: relative; flex: 1; min-height: 0; }
.pane { position: absolute; left: 0; top: 0; right: 0; bottom: 0; display: none; flex-direction: column; gap: 5px; overflow-y: auto; }
.pane.on { display: flex; animation: m-slide-left var(--m-base) var(--m-out) both; }
.field { display: flex; align-items: center; gap: 6px; min-height: 20px; }
.field > label { width: 52px; flex: none; color: var(--o-text-faint); }
.field input.ore-field { flex: 1; min-width: 0; }
.field input.ore-field.bad { border-image-source: url(../textures/ore/field_focus.png); box-shadow: 0 0 0 1px #e25a5a; }
.colors { display: flex; gap: 2px; }
.colors span { width: 14px; height: 14px; background: var(--c); border: 1px solid #0f0f10; cursor: pointer; }
.colors span.on { box-shadow: 0 0 0 1px #ffffff, 0 0 4px var(--c); }
.colors span.none { background: linear-gradient(135deg, #3a3b3c 45%, #e25a5a 46% 54%, #3a3b3c 55%); }
.lines { display: flex; flex-direction: column; gap: 2px; }
.line { display: flex; align-items: center; gap: 3px; animation: m-rise var(--m-base) var(--m-out) both; }
.line input.ore-field { flex: 1; min-width: 0; }
.ore-btn.small { min-height: 20px; padding: 0 5px; }
.ore-btn.icon.small { min-width: 16px; padding: 0; }

.picker { display: flex; flex-direction: column; gap: 3px; }
.picker .results { display: flex; flex-wrap: wrap; gap: 2px; max-height: 44px; overflow-y: auto; }
.rows { display: flex; flex-direction: column; gap: 2px; }
.erow { display: flex; align-items: center; gap: 5px; padding: 2px 4px; animation: m-rise var(--m-base) var(--m-out) both; }
.erow .nm { flex: 1; min-width: 0; color: var(--o-text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.erow .nm.ench { color: #c9a6ff; }
.erow .max { color: var(--o-text-faint); }
.stepper { display: flex; align-items: center; gap: 2px; }
.stepper .v { width: 22px; text-align: center; color: var(--o-text); }
.stepper .v.bad { color: #e25a5a; }
.erow input.ore-field { width: 44px; }
.erow .ore-select { width: 70px; }
.empty { color: var(--o-text-faint); line-height: 10px; padding: 4px; }

.tree { display: flex; flex-direction: column; font-size: 8px; }
.node > .k { display: flex; align-items: center; gap: 2px; height: 11px; cursor: pointer; color: var(--o-text-dim); -mc-tint: var(--o-text-faint); }
.node > .k:hover { color: var(--o-text); }
.node > .k .m-caret { width: 16px; height: 16px; margin: -3px 0; transform: rotate(-90deg); }
.node.m-open > .k .m-caret { transform: none; }
.node > .k .sp { width: 13px; flex: none; }
.node > .k .key { color: #86d562; }
.node > .k .val { color: #ffd36b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.node > .kids { padding-left: 10px; height: 0; opacity: 0; overflow: hidden; }

.foot { flex: none; display: flex; align-items: center; gap: 6px; padding: 4px 6px; border-top: 1px solid var(--o-line-strong); box-shadow: inset 0 1px 0 var(--o-line); }
.foot .ore-btn { min-height: 22px; padding: 0 7px; }
.foot #status { flex: 1; min-width: 0; color: var(--o-text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.foot #status.bad { color: #e25a5a; }
.foot #status.good { color: #86d562; }
</style>
</head>
<body>
<div class="o-app" id="app">
  <div class="o-window">
    <div class="o-titlebar">
      <img class="o-mark" src="../textures/icons/wand.png">
      <h1>物品编辑器</h1><span class="o-crumb" id="crumb">/ 物品</span>
      <span class="o-chip dirty" id="dirty"><img class="o-ico" src="../textures/icons/pin.png"><span id="dirty-n">0</span> 处修改</span>
      <div class="o-grow"></div>
      <div class="o-hints"><span><span class="o-kbd">Ctrl</span><span class="o-kbd">S</span>保存</span></div>
      <div class="ore-btn icon" id="close" tabindex="0" title="取消"><img class="o-ico" src="../textures/icons/close.png"></div>
    </div>
    <div class="o-body">
      <div class="left r-common" id="left">
        <div class="stage"><canvas class="fx" id="stage-fx" data-fx="glint" data-rate="0"></canvas><model id="model" item="minecraft:diamond_sword"></model></div>
        <div class="o-caps">游戏内提示</div>
        <div class="tooltip" id="tooltip"></div>
      </div>
      <div class="main">
        <div class="o-seg tabs" id="tabs">
          <span class="on" data-tab="basic"><img class="o-ico" src="../textures/icons/file.png">基础</span>
          <span data-tab="ench"><img class="o-ico" src="../textures/icons/enchant.png">附魔</span>
          <span data-tab="attr"><img class="o-ico" src="../textures/icons/sword.png">属性</span>
          <span data-tab="dura"><img class="o-ico" src="../textures/icons/shield.png">耐久</span>
          <span data-tab="all"><img class="o-ico" src="../textures/icons/tree.png">全部组件</span>
        </div>
        <div class="panes">
          <div class="pane on" data-pane="basic">
            <div class="field"><label>名称</label><input class="ore-field" id="name" maxlength="50"></div>
            <div class="field"><label>颜色</label><div class="colors" id="colors"></div></div>
            <div class="field"><label>稀有度</label><div class="o-seg" id="rarity">
              <span data-r="common">普通</span><span data-r="uncommon">罕见</span><span data-r="rare">稀有</span><span data-r="epic">史诗</span></div></div>
            <div class="o-caps">说明（Lore）</div>
            <div class="lines" id="lore"></div>
            <div><div class="ore-btn small" id="lore-add" tabindex="0"><img class="o-ico" src="../textures/icons/plus.png">添加一行</div></div>
          </div>
          <div class="pane" data-pane="ench">
            <div class="picker"><div class="field"><label>添加</label><input class="ore-field" id="ench-search" placeholder="搜索附魔，如 锋利"></div><div class="results" id="ench-results"></div></div>
            <div class="o-caps">已有附魔</div>
            <div class="rows" id="ench-rows"></div>
          </div>
          <div class="pane" data-pane="attr">
            <div class="picker"><div class="field"><label>添加</label><input class="ore-field" id="attr-search" placeholder="搜索属性，如 攻击伤害"></div><div class="results" id="attr-results"></div></div>
            <div class="o-caps">属性修饰符</div>
            <div class="rows" id="attr-rows"></div>
          </div>
          <div class="pane" data-pane="dura">
            <div class="field"><label>最大耐久</label><input class="ore-field" id="max-damage" style="flex: none; width: 70px"><span class="o-faint" id="dura-note"></span></div>
            <div class="field"><label>已损耗</label><div class="ore-slider" id="damage" tabindex="0"><div class="track"></div><div class="fill"></div><div class="thumb"></div></div><span class="o-dim" id="damage-v" style="width: 70px; text-align: right"></span></div>
            <div class="field"><label>无法破坏</label><span class="ore-toggle" id="unbreakable" tabindex="0"></span></div>
            <div class="field"><label>附魔光效</label><div class="o-seg" id="glint"><span data-g="default">默认</span><span data-g="on">总是</span><span data-g="off">从不</span></div></div>
          </div>
          <div class="pane" data-pane="all">
            <div class="o-faint">物品上的全部数据组件（只读）。编辑器不认识的组件保存时原样保留。</div>
            <div class="tree" id="tree"></div>
          </div>
        </div>
      </div>
    </div>
    <div class="foot">
      <span id="status">修改的是副本；保存前原物品不会变</span>
      <div class="ore-btn" id="revert" tabindex="0"><img class="o-ico" src="../textures/icons/undo.png">还原</div>
      <div class="ore-btn" id="cancel" tabindex="0">取消</div>
      <div class="ore-btn primary m-ripple" id="save" tabindex="0"><img class="o-ico" src="../textures/icons/save.png">保存</div>
    </div>
  </div>
</div>
</body>
</html>
