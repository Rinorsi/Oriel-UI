// The Ore theme (stylesheet and textures) and the preset screens: pages under assets/oriel/ui and their Java
// controllers. Pure Java on top of the engine, like it: no Minecraft classes, so the previewer and tests run them.
plugins {
    id 'oriel-errorprone'
    id 'java-library'
    id 'oriel-java'
    id 'maven-publish'
}

java { withSourcesJar() }
tasks.withType(Jar).configureEach {
    from(rootProject.files('LICENSE', 'NOTICE'))
}

// Common's runtime metadata must point to a published coordinate, just like engine and Rhino.
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId = 'oriel-kit'
            from components.java
        }
    }
}

dependencies {
    implementation(project(':engine'))
    // Page data is JSON; Minecraft provides Gson in game (as for the engine).
    compileOnly("com.google.code.gson:gson:${gson_version}")
    testImplementation("com.google.code.gson:gson:${gson_version}")
    testImplementation(project(':script-rhino'))
    testImplementation(project(':mc-extension'))
}

// Backend localization tests scan message references without introducing a Minecraft dependency into kit.
tasks.named('test') {
    inputs.files(['client/DevReload.java', 'client/DevAutopilot.java'].collect {
        rootProject.file('common/src/main/java/dev/oriel/mod/internal/' + it)
    }).withPropertyName('backendMessageSources')
}

tasks.withType(JavaCompile).configureEach {
    options.release = engine_java_release as int
    options.compilerArgs += ['-Xlint:all', '-Werror']
}

// The loaders copy the kit's classes and resources into the mod, as they do the engine's.
configurations {
    kitClasses {
        canBeResolved = false
        canBeConsumed = true
    }
}
artifacts {
    kitClasses(tasks.named('compileJava').flatMap { it.destinationDirectory })
    kitClasses(sourceSets.main.output.resourcesDir) {
        builtBy(tasks.named('processResources'))
    }
}
